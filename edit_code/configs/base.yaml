# Paper A (iterative self-quantization at a fixed size, 2026-11-19) -- base config. Merged with configs/domains/<domain>.yaml and
# --set KEY=VALUE overrides by rsicore.config.load_run_config (locked in run_config.yaml).
# Values marked [pilot] are assumptions to be fixed in A-P0.

draw_config: data/draw/paper_a.yaml

# Data size of every step (null = keep the draw config's value). The draw sizes below override
# data/draw/paper_a.yaml for this run (written to <run>/draw_config.effective.yaml and locked with the run).
# n / gate_n: a number (every domain) or {math: 1000, code: 500}. Other step sizes live next to their step:
#   noise.n (noise re-runs), calibration.max_texts, diagnostics.profile_contexts, heldout.limit,
#   e_task.heldout_limit.
data:
  n: null                             # signal items drawn per generation per domain (full-stage evaluation)
  screen_n: null                      # first-stage (screen) subset of the signal items (draw config: 400)
  kl_contexts: null                   # KL / calibration contexts per generation (draw config: 400; scope single: all
                                      # from the run's domain; scope all: split evenly over the five domains)
  gate_n: null                        # fixed gate items per domain

# Max generation length (tokens) per eval task, for EVERY model call of this run: candidates, gate, noise
# re-runs. Overrides eval/configs/tasks.yaml (passed to run_eval as --max-tokens); tasks not
# listed keep their tasks.yaml value. e.g. --set max_tokens.dapo_math=2048
max_tokens:
  dapo_math: 4096
  taco_verified: 4096
  ifeval_train: 2048
  sealtool_train: 1024
  triviaqa_train: 1024

# Domain scope (default single since 2026-11-19; --set scope=all or ./launch.sh --all-domains for the original
# design). single = ONLY the run's --domain: signal, gate, KL / calibration texts and held-out all on that domain.
# all = signal and gate on the run's domain(s), KL / calibration texts and held-out on all five domains.
# --domain all always runs with scope all. Merged before --set, so explicit --set values still win.
scope: single
scope_profiles:
  all: {}
  single:
    kl: {domains: run}
    heldout: {domains: run}

# One fixed size for every generation. Every candidate quantizes the ORIGINAL BF16 model M_0 (the layer
# cache is built once); generation g must beat the incumbent (best accepted quantization so far).
budget:
  gib: null                           # explicit packed GiB (overrides `reference`); CLI --budget-gib
  reference:                          # null gib -> budget = packed size of this config; it is also the
    default: {bits: 4, group_size: 128, quantizer: gptq}   # starting incumbent Q_0 (uniform W4 GPTQ;
                                                           # was W3 until 2026-11-20: W4 leaves room for 2/3-bit trades)
    embed: 8
    lm_head: 8

loop:
  editor: frozen                      # frozen: M_0 (BF16) writes every generation; current: the incumbent (ablation)
  patience: 2                         # stop after this many consecutive generations without a new incumbent

action_space:                         # what a config may use
  bits: [2, 3, 4, 8, 16]              # 16 = keep BF16
  group_sizes: [32, 64, 128]
  quantizers: [rtn, gptq, awq]        # awq = AWQ-lite (activation-aware channel scaling, RTN grid)
  embed: [bf16, 8, 4]
  lm_head: [bf16, 8, 4]

search:                               # inner search (RSI_LOOP_DESIGN §1.2)
  threads: 4
  steps: 6
  max_evaluate: 24                    # evaluations per generation: candidates + api.evaluate calls
  program_evaluate_calls: 2           # max api.evaluate calls inside one program
  top_full: 3                         # best screened candidates re-evaluated on the full signal set
  rerun_seeds: 0
  kl_weight: 0.5                      # score = retention (candidate acc / incumbent acc) - kl_weight * KL vs BF16 [pilot]

gate:                                 # L2: beat the incumbent on the fixed gate set (paired per item)
  min_delta: 0.005                    # mean paired gain over gate datasets
  require_significant: true           # some dataset 95% CI lower bound > 0, none with upper bound < 0
  max_submissions: 3
  allow_unscored: false               # true lets a gate with no scored items pass (code w/o Docker)

feedback:                             # every candidate is compared with the INCUMBENT on the same items (2026-11-20;
                                      # M_0 is not scored on the items, it is only the KL reference)
  examples: 2                         # regression examples per dataset in screen feedback: incumbent right,
                                      # candidate wrong (marked shown)

noise:
  repeats: 3                          # M_0 screen re-runs for the noise band (only when temperature > 0)
  temperature: 0.0                    # 2026-11-20: greedy, like every evaluation -> re-runs would be identical,
                                      # so none is run and the band is 0 (the gate uses paired CIs anyway);
                                      # > 0 = sampled re-runs (seeds seed, seed+1, ...)
  top_p: 1.0
  n: null                             # screen items the re-runs score (deterministic subset; null = all screen items)
  fixed: null                         # a fixed band instead of the re-runs: 0.03, or {math: 0.03, default: 0.02}
                                      # (keys: dataset, domain or default); datasets without a value are still measured

kl:
  domains: all                        # KL/calibration texts from all five domains' `kl` draw (or: run)
  top_k: 20                           # vLLM prompt_logprobs top-k (<= --max-logprobs)
  max_chars: 8000                     # the prompt part (question in chat format) is cut at this many characters
  self_generated: true                # prompt + M_0's own greedy response (cached per generation in kl_selfgen/):
                                      # KL and the GPTQ / AWQ calibration also cover the answer tokens; false =
                                      # the question alone
  self_generated_max_tokens: 2048     # response length cap (a cut response gets no <|im_end|>)
  self_generated_batch: 64            # prompts per /completions request
  eval_texts: 400                     # KL texts scored for every candidate (evenly spaced subset; null = all);
                                      # = the screen size (2026-11-20; was 64). Per-text KL is kept on disk
                                      # (evals/<cid>/<stage>/kl_per_text.json). Calibration: calibration.max_texts

calibration:                          # Hessians for GPTQ / AWQ (original model, generation-0 kl texts, once)
  max_texts: 256
  max_len: 2560                       # tokens per text (prompt + a response of up to 2048 tokens)
  layers_per_pass: 16                 # window of layers per calibration pass (fp32 Hessians ~1.6 GB/layer)

diagnostics:                          # computed once from M_0 (prep/diagnostics/), see edit_code/diagnostics.py
  profile_bits: [2, 3, 4]             # 2026-11-20: 8 bit dropped (near lossless), more contexts instead
  profile_group_size: 128
  profile_contexts: 64                # generation-0 KL texts used by the profile table (forward pass per group x
                                      # bits; ~350 groups x 3 bits; 2026-11-20: 64, was 32)
  profile_max_len: 512
  hessian_quantizers: [rtn, gptq, awq]   # hessian_table: Hessian-weighted error per (group, quantizer, bits),
  hessian_bits: null                  # from the cache + calibration Hessians, no forward pass (null = profile_bits)

cache:
  device: cuda                        # cuda -> cuda:<gpus[1]>; or cpu
  lazy: true                          # compute missing (module, quantizer, bits, gs) entries on demand
  gptq_damp: 0.01
  # the cache (run_dir/prep/) is built once from M_0 and reused by every generation
  warm:                               # precomputed for every module in the prep step
    - {quantizer: rtn, bits: 2, group_size: 128}
    - {quantizer: rtn, bits: 3, group_size: 128}
    - {quantizer: rtn, bits: 4, group_size: 128}
    - {quantizer: rtn, bits: 8, group_size: 128}
    - {quantizer: gptq, bits: 2, group_size: 128}
    - {quantizer: gptq, bits: 3, group_size: 128}
    - {quantizer: gptq, bits: 4, group_size: 128}
    - {quantizer: gptq, bits: 8, group_size: 128}
    - {quantizer: awq, bits: 2, group_size: 128}    # used by the hessian table anyway
    - {quantizer: awq, bits: 3, group_size: 128}
    - {quantizer: awq, bits: 4, group_size: 128}

candidates:
  keep_checkpoints: 1                 # fake-quant checkpoints kept per candidate server (~54 GB each; disk = servers x 54 GB)

bytes:
  count_visual: true                  # vision tower counted (BF16) in the packed size

tools:                                # ablations: remove tools from the editor's API
  profile_table: true
  activation_table: true
  solve_allocation: true
  hessian_table: true                 # 2026-11-20: analysis tools
  group_error: true
  compare: true

solver:
  group_sizes: [128]                  # group sizes solve_allocation chooses from by default (KL-greedy baseline)
  group_size_factor: {128: 1.0, 64: 0.8, 32: 0.65}   # damage scaling vs the profiled g128 [pilot]

editor:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 16384
  extra_body: {}

sandbox:
  timeout_s: 1800                     # includes time inside api.evaluate calls
  mem_gb: 16

archive:
  enabled: true                       # experience channel: earlier rounds' incumbents + top candidates in context
  top_candidates: 3

heldout:
  domains: all                        # all | run (= the run's --domain; scope=single) | a domain list
  limit: null                         # per-task item limit (null = full held-out sets)
  # Held-out decoding (2026-11-20): sampled, Qwen's non-thinking recommendation, same seed as the run; avg@n.
  # (Search, gate and noise stay greedy.) null = each task's tasks.yaml decoding (greedy).
  decoding:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    seed: null                        # null = the run's --seed (one experiment seed for everything)
    n: 1                              # samples per item (accuracy = avg@n)
    n_by_task: {aime24: 8, aime25: 8, amc23: 8, math500: 4, gpqa_diamond: 4}   # small sets: more samples

e_task:                               # editor-capability task E_t: a fresh session (no archive) of this
  enabled: false                      # generation's editor on the fixed-size task; only informative with
  budget_gib: null                    # loop.editor=current (null = the main budget)
  evaluate: 24
  threads: 4
  steps: 6
  top_full: 1
  heldout_limit: 200

baselines:
  methods: []                         # e.g. [uniform, kl_greedy, evo]; run after the search each generation
  full: false
  evo_evaluations: 24

vllm:
  editor_args: [--gpu-memory-utilization, "0.90", --max-model-len, "32768", --max-logprobs, "20"]
  candidate_args: [--gpu-memory-utilization, "0.55", --max-model-len, "20480", --max-logprobs, "20"]


# GPU roles (edit_code/common.py gpu_layout). gpu_roles unset = EVERY GPU of --gpus is used: the editor
# (M_0; idle while candidates are evaluated) gets ONE GPU, every other GPU serves candidates. The candidate
# GPUs are split into groups of candidate_group_size; each group is one candidate server, and the threads
# of a search step are evaluated at the same time (2 GPUs -> 1 server, 4 -> 3 servers, 8 -> 7 servers).
# candidate_group_size 2 = TP 2 per server (more KV cache per server, fewer servers).
# Pin a role only to override, e.g. --set 'gpu_roles.editor=[0,1]' (editor with TP 2).
gpu_roles: null
gpu_layout:
  share_single_gpu: true              # 1 GPU: editor and candidate share it (B300 / mock only)
  candidate_group_size: 1             # GPUs per candidate server (1 / 2 / 4 / 8)

# Hardware profile (--set hardware=h20, or ./launch.sh --hw h20). The defaults above assume 288 GB B300
# cards. rsicore.config merges the profile over base/domain config and BEFORE --set (--set wins).
hardware: b300
hardware_profiles:
  b300: {}
  h20:                                # H20 cards (~140 GB) PLANNED AT 110 GB each (2026-11-20); Qwen3.8-27B BF16 ~52 GB:
    gpu_layout: {share_single_gpu: false}   # still one model per card (editor + a candidate = 104 GB, no KV left)
    vllm:                             # --rsi-gpu-memory-gib 110 -> --gpu-memory-utilization = 110 GB / card total
      # (rsicore.servers; 0.78 = 110/140 if nvidia-smi is unavailable). 110 - 52 GB weights - ~6 GB runtime
      # leaves ~50 GB for KV cache + GDN states [estimate: ~64 KB/token on the 16 full-attention layers]
      editor_args: [--rsi-gpu-memory-gib, "110", --gpu-memory-utilization, "0.78", --max-model-len, "32768",
                    --max-num-seqs, "128", --max-logprobs, "20"]
      candidate_args: [--rsi-gpu-memory-gib, "110", --gpu-memory-utilization, "0.78", --max-model-len, "20480",
                       --max-num-seqs, "128", --max-logprobs, "20"]
    # calibration: the base 16 layers per pass fits (52 GB HF model + 16 x 1.6 GB fp32 Hessians + activations)
  h20_80:                             # 80 GB H20 (the earlier plan): one model per card, ~15 GB KV
    gpu_layout: {share_single_gpu: false}
    vllm:
      editor_args: [--gpu-memory-utilization, "0.92", --max-model-len, "32768", --max-num-seqs, "32", --max-logprobs, "20"]
      candidate_args: [--gpu-memory-utilization, "0.92", --max-model-len, "20480", --max-num-seqs, "32", --max-logprobs, "20"]
    calibration:
      layers_per_pass: 4              # fp32 Hessians ~1.6 GB/layer next to the 52 GB HF model on the candidate card
      max_len: 2048
    diagnostics:
      profile_contexts: 16

mock:
  base_quality: 0.8                   # mock accuracy of M_0
  lam: 1.2                            # quality = base * exp(-lam * accumulated damage)

mock_overrides:                       # applied in --mock runs only (fast local end-to-end check)
  search: {threads: 2, steps: 2, max_evaluate: 4, top_full: 1, program_evaluate_calls: 1}
  noise: {repeats: 3}
  heldout: {limit: 20}
  e_task: {threads: 1, steps: 2, evaluate: 2, top_full: 1, heldout_limit: 20}
  gate: {allow_unscored: true, min_delta: 0.002}
  baselines: {methods: [uniform, kl_greedy]}
  sandbox: {timeout_s: 300, mem_gb: 4}
