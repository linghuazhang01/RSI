# Paper A (iterative self-quantization at a fixed size, 2026-11-19) -- base config. Merged with configs/domains/<domain>.yaml and
# --set KEY=VALUE overrides by rsicore.config.load_run_config (locked in run_config.yaml).
# Values marked [pilot] are assumptions to be fixed in A-P0.

# The flow (2026-11-25, KL only): the ONLY number is the KL to the original model. Generation 0 draws kl_eval.n (256)
# items from the training pool simple_<d>_pool (rsicore.draws generation-0 draw, seeded; eval / test items and the
# calibration texts excluded); M_0 writes ONE thinking-mode answer per item and its top-k prompt logprobs are cached
# (baseline/kl_gate). Every candidate's evaluation = the per-trace token KL(M_0 || candidate) on the answer positions of
# these fixed traces, averaged over the traces (rsicore.kl; nothing is sampled). Each generation the editor writes
# search.threads x search.steps (8 x 1) candidates; the in-budget one with the LOWEST KL is accepted when its KL is
# below the incumbent's. There is no screen, no accuracy gate, no held-out test and no classic-baseline sweep. Calibration
# texts = 400 other pool items (generation 0). Run ids end in _single_simple (rsicore.config.RUN_SUFFIX); a changed
# config needs a new --run-id / --tag.

# One fixed size for every generation. Every candidate quantizes the ORIGINAL BF16 model M_0 (the layer
# cache is built once); generation g must beat the incumbent (lowest-KL quantization accepted so far).
budget:
  gib: null                           # explicit packed GiB (overrides `reference`); CLI --budget-gib
  reference:                          # null gib -> budget = packed size of this config; it is also the
    default: {bits: 4, group_size: 128, quantizer: gptq}   # starting incumbent Q_0 (uniform W4 GPTQ;
                                                           # was W3 until 2026-11-20: W4 leaves room for 2/3-bit trades)
    embed: 8
    lm_head: 8

loop:
  editor: frozen                      # frozen: M_0 (BF16) writes every generation; current: the incumbent (ablation)
  start: bf16                         # bf16: generation 1 starts from the original BF16 model (KL 0, over the budget);
                                      # the first accepted config is the lowest-KL in-budget candidate, later
                                      # generations must beat it. q0: start from Q_0 (budget.reference, uniform W4
                                      # GPTQ; ablation). Q_0's KL is recorded in generation 0 either way (reference row)
  patience: 3                         # stop after this many consecutive generations without a new incumbent
                                      # (2026-11-22, as Paper B)

action_space:                         # what a config may use
  bits: [2, 3, 4, 8, 16]              # 16 = keep BF16
  group_sizes: [32, 64, 128]
  quantizers: [rtn, gptq, awq]        # awq = AWQ-lite (activation-aware channel scaling, RTN grid)
  embed: [bf16, 8, 4]
  lm_head: [bf16, 8, 4]

search:                               # inner search (RSI_LOOP_DESIGN §1.2; edit_code.common.search_settings)
  threads: 8                          # independent editor sessions per generation (prompts use the configured numbers)
  steps: 1
  max_candidates: 8                   # candidates per generation (null = threads x steps); each gets ONE KL evaluation

kl_eval:                              # (2026-11-25) the ONLY evaluation: KL(M_0 || config) on fixed reference traces
  n: 256                              # items of generation 0's draw of the training pool, one M_0 trace each (fixed)
  max_tokens: 16384                   # max answer tokens of a trace (M_0's sampling; = Paper B's scoring decoding)
  top_k: 20                           # logprobs per position (<= the servers' --max-logprobs 20)
  temperature: 0.6                    # M_0's sampling of the traces (thinking mode, the run's seed)
  top_p: 0.95
  sample_top_k: 20
  max_num_batched_tokens: null        # vLLM --max-num-batched-tokens of every server: prompt logprobs are computed for
                                      # each prefill token of a chunk outside vLLM's memory profile (~10 B x chunk x
                                      # 248320 vocab). null = 1024 with hardware h20_80 (0.92 utilization leaves ~6 GB),
                                      # 2048 with h20 (set by the profile, 2026-11-25), vLLM's default otherwise.
                                      # Batching only: not part of the run lock

kl:                                   # calibration texts (generation 0, built once; the block keeps its old name):
                                      # GPTQ / AWQ calibration and profile contexts
  max_chars: 8000                     # the prompt part (question in chat format) is cut at this many characters
  self_generated: true                # prompt + M_0's own greedy response (cached in kl_selfgen/gen_00.jsonl): the
                                      # GPTQ / AWQ calibration and the profile table also cover the answer tokens;
                                      # false = the question alone
  self_generated_max_tokens: 2048     # response length cap (a cut response gets no <|im_end|>)
  self_generated_batch: 64            # prompts per /completions request (calibration: calibration.max_texts)

calibration:                          # Hessians for GPTQ / AWQ (original model, generation-0 kl texts, once)
  max_texts: 256
  max_len: 2560                       # tokens per text (prompt + a response of up to 2048 tokens)
  layers_per_pass: 16                 # window of layers per calibration pass (fp32 Hessians ~1.6 GB/layer; h20: 12);
                                      # the Hessians are the same sums for any window: not part of the run lock

diagnostics:                          # computed once from M_0 (prep/diagnostics/), see edit_code/diagnostics.py
  profile_bits: [2, 3, 4]             # 2026-11-20: 8 bit dropped (near lossless), more contexts instead
  profile_group_size: 128
  profile_contexts: 64                # generation-0 KL texts used by the profile table (forward pass per group x
                                      # bits; ~350 groups x 3 bits; 2026-11-20: 64, was 32)
  profile_max_len: 512
  # profile_batch_tokens: 8192      # (2026-11-21, read with this default, not written here so locked run configs
                                    # still resume) contexts are right-padded into batches of at most this many tokens
  hessian_quantizers: [rtn, gptq, awq]   # hessian_table: Hessian-weighted error per (group, quantizer, bits),
  hessian_bits: null                  # from the cache + calibration Hessians, no forward pass (null = profile_bits)

cache:
  device: cuda                        # cuda -> the first candidate GPU (each export slot: its own first GPU); or cpu
  lazy: true                          # compute missing (module, quantizer, bits, gs) entries on demand
  gptq_damp: 0.01
  # the cache (run_dir/prep/) is built once from M_0 and reused by every generation
  warm:                               # precomputed for every module in the prep step
    - {quantizer: rtn, bits: 2, group_size: 128}
    - {quantizer: rtn, bits: 3, group_size: 128}
    - {quantizer: rtn, bits: 4, group_size: 128}
    - {quantizer: rtn, bits: 8, group_size: 128}
    - {quantizer: gptq, bits: 2, group_size: 128}
    - {quantizer: gptq, bits: 3, group_size: 128}
    - {quantizer: gptq, bits: 4, group_size: 128}
    - {quantizer: gptq, bits: 8, group_size: 128}
    - {quantizer: awq, bits: 2, group_size: 128}    # used by the hessian table anyway
    - {quantizer: awq, bits: 3, group_size: 128}
    - {quantizer: awq, bits: 4, group_size: 128}

candidates:
  keep_checkpoints: 1                 # fake-quant checkpoints kept per candidate server (~54 GB each; disk = servers x 54 GB)
                                      # (2026-11-23: the slots export in parallel; an accepted candidate's checkpoint is
                                      # moved to gen_XX/model, and gen_XX/ckpt is removed after every generation)

bytes:
  count_visual: true                  # vision tower counted (BF16) in the packed size

tools:                                # ablations: remove tools from the editor's API
  profile_table: true
  activation_table: true
  solve_allocation: true
  hessian_table: true                 # 2026-11-20: analysis tools
  group_error: true

solver:
  group_sizes: [128]                  # documentation only, not read by code: solve_allocation uses [128] in code
  group_size_factor: {128: 1.0, 64: 0.8, 32: 0.65}   # damage scaling vs the profiled g128 [pilot]

# The editor (2026-11-21): Qwen3 thinking mode + a tool loop while it writes each candidate (rsicore.editor /
# rsicore.chat_tools). One round = one model turn with tool calls (run_python: exploratory code with the program's
# api; read_record: an earlier candidate's full program / feedback). After tool_rounds rounds (or a
# guard) one forced final turn with tool_choice "none"; the proposal is the reply without tool calls that holds a
# ```python block. tool_rounds 0 = the single call of before (same payload and prompt text; history_keep is then
# ignored = full history). search_history (2026-11-21, on by default; code default
# history_tool: true, set --set editor.history_tool=false to remove it): every candidate already tried (this
# generation's visible ones and all earlier generations'), one row each with a config description, GiB,
# KL, KL reduction, same_as = identical config hash; read_record then also opens earlier generations' records. Changing any key here changes the locked config: use a new --run-id.
editor:
  temperature: 0.6                    # Qwen3 thinking-mode sampling: 0.6 / 0.95 / top_k 20 / min_p 0
  top_p: 0.95
  max_tokens: 16384                   # final turn (thinking + answer)
  extra_body: {chat_template_kwargs: {enable_thinking: true}, top_k: 20, min_p: 0.0}   # {} = the template default
  tool_rounds: 20                     # max tool rounds per candidate, then one forced final turn (0 = no tools)
  turn_max_tokens: 8192               # max_tokens of a tool turn
  max_tool_calls: 100                 # tool calls per candidate (parallel calls count one each)
  proposal_tokens: 160000             # completion tokens per candidate (all turns) -> forced final turn
  proposal_wall_s: 2400               # wall clock per candidate -> forced final turn
  context_tokens: 131072              # THE context-length knob: client-side clamp of max_tokens / compaction AND
                                      # --max-model-len of the editor's vLLM server (overrides the one in
                                      # vllm.editor_args; null = keep editor_args). Candidate servers are unaffected.
                                      # Set per GPU in hardware_profiles below (h20_80: 49152).
  tool_result_chars: 6000             # a tool result is cut to this many characters (full output on disk:
                                      # gen_XX/explore/<cid>/rNN_i/)
  compact_at: 0.6                     # compact the loop when the prompt passes compact_at x context_tokens:
  keep_tool_rounds: 8                 #   older tool outputs elided except the last keep_tool_rounds rounds,
  keep_reasoning_rounds: 2            #   older reasoning dropped except the last keep_reasoning_rounds turns
  reasoning_passback: think_tag       # in-loop reasoning sent back as <think>..</think> (think_tag | field | drop)
  history_keep: 2                     # earlier steps kept in full: step 0 + the last 2 (null = all, the old view;
                                      # tool_rounds 0 always sends all)
  timeout_s: 3600                     # HTTP timeout per model call
  mock_tool_rounds: 1                 # --mock: run_python calls of the mock editor before its program
  explore:                            # run_python
    timeout_s: 300                    # per call
    mem_gb: 8
    gpu_tools: false                  # true: group_error may compute uncached settings (lazy GPTQ / AWQ on the GPU)
    persistent: true                  # (rsicore.chat_tools, 2026-11-21): one sandbox session per proposal, variables
                                      # persist across run_python calls (timeout -> restart); false = a fresh one per call
    gpu_seconds: 300                  # (Paper B only; kept for a shared editor block)

sandbox:
  timeout_s: 1800                     # a program's wall clock, every tool call included
  mem_gb: 16

archive:
  enabled: true                       # experience channel: earlier rounds in context: EVERY candidate one row
                                      # (config in one line, size, KL, error, note)
  top_candidates: 3                   # full configs quoted per round, only when the editor has no search_history /
                                      # read_record (editor.tool_rounds 0 or history_tool false)
  max_chars: 30000                    # cap of the archive text: the oldest rounds' rows are dropped first

vllm:                                 # editor_args' --max-model-len is replaced by editor.context_tokens (see editor:)
  editor_args: [--gpu-memory-utilization, "0.90", --max-model-len, "131072", --max-logprobs, "20"]
  candidate_args: [--gpu-memory-utilization, "0.55", --max-model-len, "20480", --max-logprobs, "20"]
  candidate_max_model_len: 32768      # replaces --max-model-len of candidate_args (also the hardware profiles' ones;
                                      # candidate servers, M_0 replicas): prompt + a kl_eval.max_tokens trace fits;
                                      # null = as written


# GPU roles (edit_code/common.py gpu_layout). gpu_roles unset = EVERY GPU of --gpus is used: the editor
# (M_0; idle while candidates are evaluated) gets ONE GPU, every other GPU serves candidates. The candidate
# GPUs are split into groups of candidate_group_size; each group is one candidate server, and the threads
# of a search step are evaluated at the same time (2 GPUs -> 1 server, 4 -> 3 servers, 8 -> 7 servers).
# candidate_group_size 2 = TP 2 per server (more KV cache per server, fewer servers).
# Pin a role only to override, e.g. --set 'gpu_roles.editor=[0,1]' (editor with TP 2).
gpu_roles: null
gpu_layout:
  share_single_gpu: true              # 1 GPU: editor and candidate share it (B300 / mock only)
  candidate_group_size: 1             # GPUs per candidate server (1 / 2 / 4 / 8)
  # use every GPU (2026-11-20; each only when the editor has its own GPUs):
  editor_sleep: true                  # the editor (vLLM sleep mode: weights -> CPU RAM, ~52 GB) sleeps while the
                                      # candidates of a search step are evaluated; its GPUs serve as one more
                                      # candidate slot (4 GPUs: 4 candidates at once instead of 3)
  m0_replicas: true                   # M_0 batch jobs (generation 0 KL traces + logprobs, self-generated calibration
                                      # answers) on every GPU group, items split over the replicas
  prep_all_gpus: true                 # generation-0 calibration / profile table / cache / hessian table on every GPU
  gate_split: true                    # a candidate's KL evaluation on ceil(slots / proposals per step) slots, the
                                      # traces split over them: 8 GPUs and 4 proposals -> 2 GPUs per candidate; 8 x 1
                                      # -> 1; batching only (not part of the run lock)

# Hardware profile (--set hardware=h20, or ./launch.sh --hw h20). The defaults above assume 288 GB B300
# cards; the b300 profile plans them at 220 GB (2026-11-21). rsicore.config merges the profile over base/domain
# config and BEFORE --set (--set wins).
hardware: b300
hardware_profiles:
  b300:                               # B300 (~270 GB visible) PLANNED AT 220 GB per card (2026-11-21)
    vllm:                             # --rsi-gpu-memory-gib 220 -> --gpu-memory-utilization = 220 GB / card total
      # (rsicore.servers; 0.81 = 220/270 if nvidia-smi is unavailable). 220 - 52 GB weights - ~6 GB runtime leaves
      # ~160 GB KV: 4 editor threads x 8 GiB at 131072 tokens fit easily. One model per card (>= 2 GPUs); on a
      # single shared GPU the editor sleeps (weights to CPU) while the candidate server runs.
      editor_args: [--rsi-gpu-memory-gib, "220", --gpu-memory-utilization, "0.81", --max-model-len, "131072",
                    --max-num-seqs, "128", --max-logprobs, "20"]
      candidate_args: [--rsi-gpu-memory-gib, "220", --gpu-memory-utilization, "0.81", --max-model-len, "20480",
                       --max-num-seqs, "128", --max-logprobs, "20"]
    editor: {context_tokens: 131072}
  h20:                                # H20 cards (~140.4 GiB visible) PLANNED AT 100 GiB each (2026-11-25; was 110):
    # every process of ours on a GPU together stays <= 100 GiB ("GiB" = nvidia-smi MiB / 1024). 110 OOMed in the
    # generation-0 profile table (a profile worker peaked ~86 GiB reserved next to foreign memory on the card).
    # Qwen3.8-27B BF16: ~52 GiB of vLLM weights, ~54.7 GiB as an HF model. Per GPU (vLLM budget + what sits outside it):
    #   editor GPU       : editor 90 + prompt logprobs ~4.7 (chunk 2048, below)                         = ~95
    #   lent editor GPU  : sleeping editor ~1-2 (weights in CPU RAM, KV freed) + a candidate 84 + ~4.7  = ~91
    #   1st candidate GPU: candidate 84 + ~4.7 + group_error / lazy GPTQ torch work of the run (+3-8)   = ~97
    #   other candidates : candidate 84 + ~4.7 (also the M_0 replicas of generation 0)                  = ~89
    #   prep (no vLLM)   : calibration ~78 (54.7 HF model + 12 x 1.57 fp32 Hessians + activations), profile worker
    #                      ~60 (HF model + reference log-probs / packed-batch logits; ~79 allocated / ~86 reserved
    #                      before its 2026-11-25 hidden-state change), cache warm-up ~8
    #   not counted above: the run process's CUDA context on every GPU prep touched (~0.5 each) and vLLM's own
    #   context / CUDA graphs (~1-1.5); worst case ~99 on the 1st candidate GPU. Lower candidate_args to 82 if the
    #   first H20 run's logs show less headroom (profile workers log their peak; vLLM logs its KV size)
    # KV left: editor 90 - 52 weights - ~2 activations = ~36 GiB (~64 KB/token on the 16 full-attention layers + GDN
    # states [estimate]): 4 threads x 8 GiB at 131072 tokens fit; 8 threads at full context preempt (slower, not an
    # error). Candidates 84 - 52 - ~2 = ~30 GiB: plenty for 32768-token KL traces.
    gpu_layout: {share_single_gpu: false}   # still one model per card (editor + a candidate = 104 GiB, no KV left)
    vllm:                             # --rsi-gpu-memory-gib X -> --gpu-memory-utilization = X GiB / card total
      # (rsicore.servers; 0.64 = 90/140.4 and 0.60 = 84/140.4 if nvidia-smi is unavailable). candidate_args also
      # serve the M_0 replicas; the first candidate GPU keeps 6 GiB more room for the run's own torch work.
      # The memory flags (and --max-num-batched-tokens) are not part of the run lock (rsicore.config, 2026-11-25).
      editor_args: [--rsi-gpu-memory-gib, "90", --gpu-memory-utilization, "0.64", --max-model-len, "131072",
                    --max-num-seqs, "128", --max-logprobs, "20"]
      candidate_args: [--rsi-gpu-memory-gib, "84", --gpu-memory-utilization, "0.60", --max-model-len, "20480",
                       --max-num-seqs, "128", --max-logprobs, "20"]
    kl_eval:                          # vLLM computes prompt logprobs for every prefill token of a chunk OUTSIDE its
      max_num_batched_tokens: 2048    # profiled budget: ~10 B x chunk x 248320 vocab -> 8192: ~19 GiB, 2048: ~4.7 GiB
                                      # (edit_code.common.with_kl_chunk_cap; batching only, not locked)
    calibration:                      # fp32 Hessians ~1.57 GiB/layer: 12 x 1.57 = ~19 GiB next to the 54.7 GiB HF
      layers_per_pass: 12             # model -> ~78 GiB peak (16 was ~84); the same Hessian sums, not locked
    editor: {context_tokens: 131072}  # ~36 GiB KV >= 4 threads x 8 GiB at 131072 tokens
  h20_80:                             # 80 GB H20 (the earlier plan): one model per card, ~15 GB KV
    gpu_layout: {share_single_gpu: false}
    vllm:
      editor_args: [--gpu-memory-utilization, "0.92", --max-model-len, "49152", --max-num-seqs, "32", --max-logprobs, "20"]
      candidate_args: [--gpu-memory-utilization, "0.92", --max-model-len, "20480", --max-num-seqs, "32", --max-logprobs, "20"]
    calibration:
      layers_per_pass: 4              # fp32 Hessians ~1.6 GB/layer next to the 52 GB HF model on the candidate card
      max_len: 2048
    diagnostics:
      profile_contexts: 16
    editor: {context_tokens: 49152}   # ~15 GB KV: 4 threads x 3 GiB at 49152 tokens (65536 only with <= 3 threads)

mock:
  base_quality: 0.8                   # mock accuracy of M_0
  lam: 1.2                            # quality = base * exp(-lam * accumulated damage)

mock_overrides:                       # applied in --mock runs only, after --set (fast local end-to-end check):
                                      # the real layout small (3 threads x 1 step, 24 KL traces)
                                      # (mock_overrides win over --set)
  search: {threads: 3, steps: 1, max_candidates: 3}
  kl_eval: {n: 24}
  sandbox: {timeout_s: 300, mem_gb: 4}
  editor: {proposal_wall_s: 600, explore: {timeout_s: 120, mem_gb: 4}}
