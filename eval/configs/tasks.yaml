# Per-task decoding + grading config for eval/run_eval.py.
# Precedence: CLI flags (--temperature/--n/--max-tokens/--thinking) > task entry > defaults.
# `thinking` toggles Qwen3 thinking mode via chat_template_kwargs={"enable_thinking": ...}
# (vLLM passes it to the chat template). When thinking is on, max_tokens_thinking is used.

defaults:
  temperature: 0.0          # greedy
  top_p: 1.0
  top_k: null               # null = not sent; sent only for sampled decoding (temperature > 0)
  n: 1
  max_tokens: 4096
  max_tokens_thinking: 32768
  thinking: false
  seed: 42                  # experiment seed (single seed, 2026-11-19); sent to vLLM for sampled decoding
  send_chat_template_kwargs: true

# Optional LLM judge (MT-Bench / AlpacaEval only). Fixed here so judged scores are comparable.
# Requires --judge-endpoint (or set endpoint below); the API key is read from env var api_key_env.
judge:
  endpoint: null
  model: gpt-4.1-2025-04-14
  api_key_env: JUDGE_API_KEY
  temperature: 0.0
  max_tokens: 2048

templates:
  math_cot: "{problem}\n\nPlease reason step by step, and put your final answer within \\boxed{{}}."
  mcq: "Answer the following multiple choice question. Think step by step, then finish your response with \"The answer is (X)\" where X is one of {letters}.\n\nQuestion: {question}"
  short_qa: "Answer the following trivia question with a short answer (a name, number, date or short phrase); do not explain. End your response with \"Answer: <answer>\".\n\nQuestion: {question}"
  squad_closed_book: "Answer the following question about \"{title}\" from memory with a short phrase. End your response with \"Answer: <answer>\".\n\nQuestion: {question}"
  humaneval: "Complete the following Python function. Return the complete function (signature included) in a single ```python code block.\n\n```python\n{prompt}\n```"
  mbpp: "You are an expert Python programmer. Solve the following task and return the complete solution in a single ```python code block. Your code should pass this test:\n\n{test}\n\nTask: {prompt}"
  lcb_system: "You are an expert Python programmer. You will be given a question (problem specification) and will generate a correct Python program that matches the specification and passes all tests."

tasks:
  # ------------------------------------------------------------- math
  # training sets: the sources of the simple_* eval sets below (same grader / template); a run scores them as the
  # simple_<domain>_* tasks (--pool pool, --ids-file from the run's draws/gen_XX/ids/ for the train role)
  gsm8k_train:    {dataset: gsm8k_train, category: math, grader: math, allowed_pools: [reserve]}  # not used since 2026-11-19
  math_train:     {dataset: math_train, category: math, grader: math, allowed_pools: [reserve]}  # not used since 2026-11-19
  dapo_math:      {dataset: dapo_math, category: math, grader: math, max_tokens: 4096, allowed_pools: [pool]}
  # held-out
  gsm8k:          {dataset: gsm8k, category: math, grader: math}               # pool: test (all 1,319)
  math:           {dataset: math, category: math, grader: math}               # pools: test(=MATH-500) / reserve
  math500:        {dataset: math, category: math, grader: math, allowed_pools: [test]}
  aime24:         {dataset: aime24, category: math, grader: math, max_tokens: 16384}   # greedy since 2026-11-20 (was n 8, T 0.6, top_p 0.95)
  aime25:         {dataset: aime25, category: math, grader: math, max_tokens: 16384}   # greedy since 2026-11-20 (was n 8, T 0.6, top_p 0.95)
  amc23:          {dataset: amc23, category: math, grader: math, max_tokens: 16384}   # greedy since 2026-11-20 (was n 8, T 0.6, top_p 0.95)
  olympiadbench:  {dataset: olympiadbench, category: math, grader: math, max_tokens: 8192}
  # ------------------------------------------------------------- code (graded only in the Docker sandbox)
  apps:           {dataset: apps, category: code, grader: apps, max_tokens: 4096, allowed_pools: [reserve]}  # no longer used (2026-11-19); kept for reference
  taco_verified:  {dataset: taco_verified, category: code, grader: apps, max_tokens: 4096, allowed_pools: [pool]}  # training set
  humanevalplus:  {dataset: humanevalplus, category: code, grader: humanevalplus}
  mbppplus:       {dataset: mbppplus, category: code, grader: mbppplus}
  livecodebench:  {dataset: livecodebench, category: code, grader: livecodebench, max_tokens: 8192}
  # ------------------------------------------------------------- knowledge
  # training sets
  arc:            {dataset: arc, category: knowledge, grader: mcq, allowed_pools: [reserve]}  # not used since 2026-11-19
  gpqa_main:      {dataset: gpqa_main, category: knowledge, grader: mcq, allowed_pools: [reserve]}  # not used since 2026-11-19  # Main minus Diamond; gated data
  triviaqa_train: {dataset: triviaqa_train, category: knowledge, grader: short_qa, max_tokens: 1024, allowed_pools: [pool]}  # 1024 since 2026-11-20 (was 256)
  # held-out
  mmlu_pro:       {dataset: mmlu_pro, category: knowledge, grader: mcq}
  gpqa_diamond:   {dataset: gpqa_diamond, category: knowledge, grader: mcq}   # needs manual download
  triviaqa:       {dataset: triviaqa, category: knowledge, grader: short_qa, max_tokens: 256}
  freebaseqa:     {dataset: freebaseqa, category: knowledge, grader: short_qa, max_tokens: 256}
  # ------------------------------------------------------------- knowledge injection (Paper B / SEAL setting)
  squad_closed_book_test: {dataset: squad_val, category: knowledge_injection, grader: squad_closed_book, max_tokens: 256, allowed_pools: [test, reserve]}
  squad_closed_book_dev:  {dataset: squad_train, category: knowledge_injection, grader: squad_closed_book, max_tokens: 256, allowed_pools: [search, gate]}
  # ------------------------------------------------------------- instruction following
  # training set: RLVR-IFeval (one constraint per prompt; deterministic verifiers in graders/rlvr_if.py)
  ifeval_train:   {dataset: ifeval_train, category: instruction_following, grader: rlvr_if, max_tokens: 2048, allowed_pools: [pool]}
  # IFEval: gate (135) = IF gate, test (271) = held-out; its 135-item pool is no longer drawn from
  ifeval:         {dataset: ifeval, category: instruction_following, grader: ifeval, max_tokens: 2048}
  ifbench:        {dataset: ifbench, category: instruction_following, grader: ifbench, max_tokens: 2048}
  mt_bench:       {dataset: mt_bench, category: instruction_following, grader: mt_bench_judge, max_tokens: 2048, temperature: 0.0, optional_judge: true}
  alpaca_eval:    {dataset: alpaca_eval, category: instruction_following, grader: alpaca_eval_judge, max_tokens: 2048, optional_judge: true}
  # ------------------------------------------------------------- tool calling
  sealtool_train: {dataset: sealtool_train, category: tool_calling, grader: sealtool, max_tokens: 1024, allowed_pools: [pool]}  # training set
  sealtool:       {dataset: sealtool, category: tool_calling, grader: sealtool, max_tokens: 1024}   # held-out: test_in_domain + test_out_domain
  bfcl:           {dataset: bfcl, category: tool_calling, grader: bfcl, max_tokens: 2048}
  teval:          {dataset: teval, category: tool_calling, grader: teval, max_tokens: 2048,
                   subsets: [instruct_v2, review_str_v2, retrieve_str_v2, understand_str_v2]}
  metatool:       {dataset: metatool, category: tool_calling, grader: metatool, max_tokens: 512}
  apibank:        {dataset: apibank, category: tool_calling, grader: apibank, max_tokens: 512}

# Eval-set datasets (rsicore.evalsets; data/scripts/build_eval_target.py copies the items, ids and fields unchanged,
# into data/processed/<dataset>.jsonl, split pool `pool`; the task <dataset> inherits the source task's entry: grader,
# template, max_tokens, with allowed_pools [pool]).
eval_targets:
  # Fixed sets from simple_data/ (2026-11-21, data/scripts/make_simple_data.py): per domain 1,500 train + 500 eval
  # + 500 test items sampled from the decontaminated, de-duplicated training pool, graded like the domain's training
  # set. Form {task, file, dataset}: the items of `file` become dataset / task `dataset` (pool `pool`). Form
  # {task, ids_file, dataset}: the task dataset's records whose id is in `ids_file` (simple_<domain>_pool = the whole
  # clean pool, simple_data/<domain>/pool_ids.json). A run: train role simple_<domain>_pool (per-generation
  # screen draws, rsicore.draws), gate simple_<domain>_eval, held-out simple_<domain>_test.
  # simple_<domain>_train stays registered for older runs.
  simple_math_train: {task: dapo_math, file: simple_data/math/train.jsonl, dataset: simple_math_train}
  simple_math_eval: {task: dapo_math, file: simple_data/math/eval.jsonl, dataset: simple_math_eval}
  simple_math_test: {task: dapo_math, file: simple_data/math/test.jsonl, dataset: simple_math_test}
  simple_math_pool: {task: dapo_math, ids_file: simple_data/math/pool_ids.json, dataset: simple_math_pool}
  simple_code_train: {task: taco_verified, file: simple_data/code/train.jsonl, dataset: simple_code_train}
  simple_code_eval: {task: taco_verified, file: simple_data/code/eval.jsonl, dataset: simple_code_eval}
  simple_code_test: {task: taco_verified, file: simple_data/code/test.jsonl, dataset: simple_code_test}
  simple_code_pool: {task: taco_verified, ids_file: simple_data/code/pool_ids.json, dataset: simple_code_pool}
  simple_knowledge_train: {task: triviaqa_train, file: simple_data/knowledge/train.jsonl, dataset: simple_knowledge_train}
  simple_knowledge_eval: {task: triviaqa_train, file: simple_data/knowledge/eval.jsonl, dataset: simple_knowledge_eval}
  simple_knowledge_test: {task: triviaqa_train, file: simple_data/knowledge/test.jsonl, dataset: simple_knowledge_test}
  simple_knowledge_pool: {task: triviaqa_train, ids_file: simple_data/knowledge/pool_ids.json,
                          dataset: simple_knowledge_pool}
  simple_instruction_following_train: {task: ifeval_train, file: simple_data/instruction_following/train.jsonl,
                                       dataset: simple_instruction_following_train}
  simple_instruction_following_eval: {task: ifeval_train, file: simple_data/instruction_following/eval.jsonl,
                                      dataset: simple_instruction_following_eval}
  simple_instruction_following_test: {task: ifeval_train, file: simple_data/instruction_following/test.jsonl,
                                      dataset: simple_instruction_following_test}
  simple_instruction_following_pool: {task: ifeval_train, ids_file: simple_data/instruction_following/pool_ids.json,
                                      dataset: simple_instruction_following_pool}
  simple_tool_calling_train: {task: sealtool_train, file: simple_data/tool_calling/train.jsonl, dataset: simple_tool_calling_train}
  simple_tool_calling_eval: {task: sealtool_train, file: simple_data/tool_calling/eval.jsonl, dataset: simple_tool_calling_eval}
  simple_tool_calling_test: {task: sealtool_train, file: simple_data/tool_calling/test.jsonl, dataset: simple_tool_calling_test}
  simple_tool_calling_pool: {task: sealtool_train, ids_file: simple_data/tool_calling/pool_ids.json,
                             dataset: simple_tool_calling_pool}
