# Official harness repos used by the graders, pinned to exact commits (shallow fetch of that commit).
# Recreate with: bash eval/setup_env.sh   (clones are code we import; nothing in data/raw is executed)
IFBench:
  repo: allenai/IFBench
  commit: 488918665d53f867fa908a293769ec6e71e74aec
  use: IFBench checker (installed into the venv with --no-deps as package `ifbench` 0.2.0)
google-research-ifeval:
  repo: google-research/google-research
  commit: 7117df5f368e1301e34bd014be9c93e24a4e73c6
  sparse: [instruction_following_eval]
  use: official IFEval checker (instruction_following_eval/*)
T-Eval:
  repo: open-compass/T-Eval
  commit: 58f22406404d7e2a4f36856a19c7f4dc28a0a5f0
  use: official T-Eval evaluators (teval/evaluators)
DAMO-ConvAI-apibank:
  repo: AlibabaResearch/DAMO-ConvAI
  commit: faf754671f5b850e1b4d1ff870db37a6a2480df6
  sparse: [api-bank]
  use: API-Bank official API-call parser (api-bank/api_call_extraction.py)
MetaTool:
  repo: HowieHwong/MetaTool
  commit: 35e81bb7576826e980c80fed8f8c0a2b4a1e6fbb
  sparse: [src]
  use: reference only (prompt construction); MetaTool ships no scoring script
LiveCodeBench:
  repo: LiveCodeBench/LiveCodeBench
  commit: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
  use: lcb_runner.evaluation (copied into the Docker sandbox image only)
evalplus:
  repo: evalplus/evalplus
  commit: 26d6d00bb1fd0fa37f39c99d5290da67891d1c5e
  use: reference (sandbox installs the PyPI release evalplus==0.3.1)
nltk_data:
  repo: nltk/nltk_data
  commit: 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
  files: [packages/tokenizers/punkt_tab.zip, packages/corpora/stopwords.zip, packages/taggers/averaged_perceptron_tagger_eng.zip]
  use: unpacked into eval/.nltk_data (pickle-free resources only)
