# Paper B · math only · method.mode = weights · H20, 4 GPUs
# Generated snapshot (2026-11-21) of the MERGED config: lora_code/configs/base.yaml + domains/math.yaml + h20 +
# scope single + --set method.mode=weights. Not read by the code (source of truth: base.yaml + --set).
# weights: the editor M_t edits its weights directly with structured, any-rank operations (w_scale, w_scale_rows /
# w_scale_cols, w_add_lora = a low-rank piece built with the LoRA tools added as a dense dW, w_toward_original);
# per-module ||W'-W||/||W|| <= weights.norm_cap_tau (0.05). Nothing is trained. A candidate is exported (only the
# edited shards rewritten) and served on a free candidate slot: 4 GPUs = editor [0] (sleeps while candidates are
# evaluated and lends its GPU as a 3rd slot), slots [1], [2], train [3]. Gate: paired with M_t, gain >= gate.min_gain
# and 95% CI lower bound > 0; else keep M_t. An accepted edit is written into the weights -> M_{t+1}.
#
# Launch:
#   ./launch.sh --hw h20 --paper B --domains math --gens 5 --gpus 4,5,6,7 --set method.mode=weights
#   (add --eval-overfit to optimise directly on MATH-500 + GSM8K test)
