# Paper B · self-written LoRA (method.mode scratch: nothing is trained; the merged model is the next editor) · tool_calling only · objective simple (v2, 2026-11-21) · B300 planned at 220 GB per card
# Generated snapshot of the MERGED config (lora_code/configs/base.yaml + domains/tool_calling.yaml + hardware b300 + scope single
# + objective simple). Not read by the code (source of truth: base.yaml + --set); a run locks its own copy in
# experiment_records/<run id>/run_config.yaml. Regenerate after changing base.yaml.
# Data (simple_data/tool_calling/, data/scripts/make_simple_data.py): the decontaminated, de-duplicated sealtool_train pool (pool_ids.json)
#   gate  = simple_tool_calling_eval, 500 fixed items (hidden; the editor sees only statistics of earlier candidates' gate results)
#   test  = simple_tool_calling_test, 500 fixed items (held-out report only, never visible, never used for selection)
#   screen = 500 items drawn afresh every generation from the pool minus gate and test (the same items for Papers A and
#            B in the same search round); train = all remaining pool items (the editor's train ids)
# Each generation (search.threads 8 x search.steps 1 candidates, editor.tool_rounds 20):
#   1. the latest model answers the 500 screen items, 4 samples each, once; the editor sees the detailed
#      results (summary in the context; screen_results / screen_output tools, incl. the thinking text);
#   2. each candidate: a program (persistent run_python session while exploring; no api.evaluate) builds it; ONE gate
#      evaluation (500 x 4, paired with the latest model); its gate statistics are visible to later steps / generations;
#   3. accept the candidate with the largest paired gate gain >= gate.min_gain 0.0 (require_significant
#      True); then the test set (500 x 4).
# Decoding (screen / gate / test): thinking on, temperature 0.6, top_p 0.95, top_k 20, max_tokens 16384.
# Start: ./launch.sh --hw b300 --paper B --domains tool_calling --simple --gens 5 --gpus 0,1,2,3,4,5,6,7 --tag <name>
