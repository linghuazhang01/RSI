  - --rsi-gpu-memory-gib
  - '220'
  - --gpu-memory-utilization
  - '0.81'
  - --max-model-len
  - '20480'
  - --max-num-seqs
  - '128'
  - --max-logprobs
  - '20'
  candidate_max_model_len: 32768
gpu_roles: null
gpu_layout:
  share_single_gpu: true
  candidate_group_size: 1
  editor_sleep: true
  m0_replicas: true
  parallel_heldout: true
  prep_all_gpus: true
hardware: b300
domain: code
