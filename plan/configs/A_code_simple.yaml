# Paper A · self-quantization (fixed W4-size budget; the editor is the frozen M_0, the incumbent is the latest model) · code only · simple flow (v2, 2026-11-21) · B300 planned at 220 GB per card
# Generated snapshot of the MERGED config (edit_code/configs/base.yaml + domains/code.yaml + hardware b300).
# Not read by the code (source of truth: base.yaml + --set); a run locks its own copy in
# experiment_records/<run id>/run_config.yaml. Regenerate after changing base.yaml.
# Data (simple_data/code/, data/scripts/make_simple_data.py): the decontaminated, de-duplicated taco_verified pool (pool_ids.json)
#   gate  = simple_code_eval, 500 fixed items (hidden; the editor sees only statistics of earlier candidates' gate results)
#   test  = simple_code_test, 500 fixed items (held-out report only, never visible, never used for selection)
#   screen = 500 items drawn afresh every generation from the pool minus gate and test (the same items for Papers A and
#            B in the same search round); train = all remaining pool items (the editor's train ids)
# Each generation (search.threads 8 x search.steps 1 candidates, editor.tool_rounds 20):
#   1. the latest model answers the 500 screen items, 4 samples each, once; the editor sees the detailed
#      results (summary in the context; screen_results / screen_output tools, incl. the thinking text);
#   2. each candidate: a program (persistent run_python session while exploring) builds it; ONE gate
#      evaluation (500 x 4, paired with the latest model); its gate statistics are visible to later steps / generations;
#   3. accept the candidate with the largest paired gate gain >= gate.min_delta 0.0 (require_significant
#      True); then the test set (500 x 4).
# Decoding (screen / gate / test): thinking on, temperature 0.6, top_p 0.95, top_k 20, max_tokens 16384.
# Start: ./launch.sh --hw b300 --paper A --domains code --gens 5 --gpus 0,1,2,3,4,5,6,7 --tag <name>
simple:
  screen_n: 500
decoding:
  screen:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    thinking: true
    max_tokens: 16384
    n: 4
    seed: 42
  gate:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    thinking: true
    max_tokens: 16384
    n: 4
    seed: 42
max_tokens:
  dapo_math: 4096
  taco_verified: 4096
  ifeval_train: 2048
  sealtool_train: 1024
  triviaqa_train: 1024
budget:
  gib: null
  reference:
    default:
      bits: 4
      group_size: 128
      quantizer: gptq
    embed: 8
    lm_head: 8
loop:
  editor: frozen
  patience: 3                 # 2026-11-22: as Paper B
action_space:
  bits:
  - 2
  - 3
  - 4
  - 8
  - 16
  group_sizes:
  - 32
  - 64
  - 128
  quantizers:
  - rtn
  - gptq
  - awq
  embed:
  - bf16
  - 8
  - 4
  lm_head:
  - bf16
  - 8
  - 4
search:
  threads: 8
  steps: 1
  max_candidates: 8
gate:
  min_delta: 0.0
  require_significant: true
  allow_unscored: false
feedback:
  examples: 2
kl:
  max_chars: 8000
  self_generated: true
  self_generated_max_tokens: 2048
  self_generated_batch: 64
calibration:
  max_texts: 256
  max_len: 2560
  layers_per_pass: 16
diagnostics:
  profile_bits:
  - 2
  - 3
  - 4
  profile_group_size: 128
  profile_contexts: 64
  profile_max_len: 512
  hessian_quantizers:
  - rtn
  - gptq
  - awq
  hessian_bits: null
cache:
  device: cuda
  lazy: true
  gptq_damp: 0.01
  warm:
  - quantizer: rtn
    bits: 2
    group_size: 128
  - quantizer: rtn
    bits: 3
    group_size: 128
  - quantizer: rtn
    bits: 4
    group_size: 128
  - quantizer: rtn
    bits: 8
    group_size: 128
  - quantizer: gptq
    bits: 2
    group_size: 128
  - quantizer: gptq
    bits: 3
    group_size: 128
  - quantizer: gptq
    bits: 4
    group_size: 128
  - quantizer: gptq
    bits: 8
    group_size: 128
  - quantizer: awq
    bits: 2
    group_size: 128
  - quantizer: awq
    bits: 3
    group_size: 128
  - quantizer: awq
    bits: 4
    group_size: 128
candidates:
  keep_checkpoints: 1
bytes:
  count_visual: true
tools:
  profile_table: true
  activation_table: true
  solve_allocation: true
  hessian_table: true
  group_error: true
  compare: true
solver:
  group_sizes:
  - 128
  group_size_factor:
    128: 1.0
    64: 0.8
    32: 0.65
editor:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 16384
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
    top_k: 20
    min_p: 0.0
  tool_rounds: 20
  turn_max_tokens: 8192
  max_tool_calls: 100
  proposal_tokens: 160000
  proposal_wall_s: 2400
  context_tokens: 131072
  tool_result_chars: 6000
  compact_at: 0.6
  keep_tool_rounds: 8
  keep_reasoning_rounds: 2
  reasoning_passback: think_tag
  history_keep: 2
  timeout_s: 3600
  mock_tool_rounds: 1
  explore:
    timeout_s: 300
    mem_gb: 8
    gpu_tools: false
    persistent: true
    gpu_seconds: 300
sandbox:
  timeout_s: 1800
  mem_gb: 16
archive:
  enabled: true
  top_candidates: 3
  max_chars: 30000
heldout:
  limit: null
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 42
    n: 4
    n_by_task: null
    thinking: true
    max_tokens: 16384
  enabled: true
baselines:
  methods: []
  full: false
  evo_evaluations: 24
vllm:
  editor_args:
  - --rsi-gpu-memory-gib
  - '220'
  - --gpu-memory-utilization
  - '0.81'
  - --max-model-len
  - '131072'
  - --max-num-seqs
  - '128'
  - --max-logprobs
  - '20'
