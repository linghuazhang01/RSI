# Paper B · math only · method.mode = scratch · H20 (110 GB/card)
# Generated snapshot (2026-11-20) of the MERGED config: lora_code/configs/base.yaml + domains/math.yaml
# + hardware profile h20 + scope single + --set method.mode=scratch. Not read by the code: the source of
# truth is base.yaml and --set.
# scratch: the editor M_t builds the LoRA from zero (SVD / activation statistics / constructions). Nothing is
# ever trained in this run: no SFT baseline, no raw LoRA, no training / gradient tools; the train items get
# gold answers (no answer sampling). Free analysis tools: compare (ids only) and train_loss (forward only).
# Gate: only candidates with a positive signal score (beat M_t) are submitted; on the 1000 gate items, paired
# with M_t, mean gain >= gate.min_gain (0.01) AND 95% CI lower bound > 0; else keep M_t. Stop after 3
# consecutive kept generations (loop.patience). (raw.* and train_data.* below are unused in scratch.)
# Data sizes (data: null -> data/draw/paper_b.yaml): math n=2000 / gen (50% train = 1000, used only for
# activation statistics / train_loss; 50% signal = 1000), screen_n=400, gate_n=1000; no retention probes,
# no E_t (scope single).
#
# Launch on 4 GPUs (main = editor + candidate LoRAs on 2 GPUs, tensor parallel 2; train = SVD / activation
# stats / train_loss / merge on 2 GPUs); one seed (--seed 42) for everything:
#   ./launch.sh --hw h20 --paper B --domains math --gens 5 --gpus 4,5,6,7 --set method.mode=scratch
# Run id: B_math_s42_single -> experiment_records/B_math_s42_single/run_config.yaml is the locked copy.
