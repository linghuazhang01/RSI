# Paper A · math only · fixed budget = uniform W4 GPTQ g128 (embed / lm_head 8 bit) · H20 (110 GB/card)
# Generated snapshot (2026-11-20) of the MERGED config: edit_code/configs/base.yaml + domains/math.yaml
# + hardware profile h20 + scope single. Not read by the code: the source of truth is base.yaml and --set.
# Data sizes (data: null -> data/draw/paper_a.yaml): math n=2000 signal / gen, screen_n=400, gate_n=1000,
# kl_contexts=400 (all dapo_math since scope single; KL on all 400, calibration on the first 256).
# Candidates are compared with the incumbent on the same items (M_0 is only the KL reference).
#
# Launch on 4 GPUs (editor on 1 GPU, the other 3 = 3 candidate servers; while candidates are evaluated the editor
# sleeps (weights -> CPU RAM) and its GPU is a 4th candidate slot; generation-0 prep, M_0 batch jobs and held-out
# evaluation use all 4 GPUs); one seed (--seed 42) for everything:
#   ./launch.sh --hw h20 --paper A --domains math --gens 5 --gpus 0,1,2,3
# Run id: A_math_s42_single -> experiment_records/A_math_s42_single/run_config.yaml is the locked copy.
