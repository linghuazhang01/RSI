# Paper B · self-written LoRA (method.mode scratch: nothing is trained) · instruction_following only · objective simple · B300 planned at 220 GB per card
# Generated snapshot (2026-11-21) of the MERGED config: lora_code/configs/base.yaml + domains/instruction_following.yaml + hardware b300
# + scope single + objective simple. Not read by the code (source of truth: base.yaml + --set); the run locks its own
# copy in experiment_records/B_instruction_following_s42_single_simple/run_config.yaml.
# Data (simple_data/instruction_following/, committed; data/scripts/make_simple_data.py): the decontaminated, de-duplicated ifeval_train pool,
# 1,500 items sampled for training and 500 disjoint ones for the gate. Graded by the RLVR-IFeval verifiers (rlvr_if).
#   train role = simple_instruction_following_train (all 1,500 items every generation, nothing drawn)
#   gate role  = simple_instruction_following_eval (all 500 items)
#   held-out evaluation: disabled (heldout.enabled false)
# Each generation: the editor M_t writes LoRAs from zero; its tools (train_example / acts / train_loss)
# see the 1,500 train items and their gold answers; candidates are screened on all 1,500 against M_t
# (greedy) and only those with a positive gain go to the gate on the 500 gate items, paired with M_t
# (gate.min_gain and the 95% CI lower bound > 0); an accepted LoRA is merged. No retention probes, no E_t.
# Editor (改造者): Qwen3 thinking mode (editor.extra_body enable_thinking, temperature 0.6 / top_p 0.95 / top_k 20);
# per candidate up to editor.tool_rounds (50) rounds of tool calls (run_python with the explore api, read_record), then
# a forced final turn; context editor.context_tokens (131072, also the editor server's --max-model-len).
# Search / gate / noise decoding: greedy.
# Start: ./launch.sh --paper B --domains instruction_following --simple --gens 5 --gpus <ids>   (run id B_instruction_following_s42_single_simple)
