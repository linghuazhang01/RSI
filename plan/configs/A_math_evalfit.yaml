# Paper A · objective eval_overfit · optimise directly on the eval sets · H20, 4 GPUs
# Generated snapshot (2026-11-20) of the MERGED config: edit_code/configs/base.yaml + domains/math.yaml + h20 +
# scope single + objective eval_overfit. Not read by the code (source of truth: base.yaml + --set).
# Data: math_eval = MATH-500 + GSM8K test (1819 items; data/scripts/build_eval_target.py, built on demand).
# Every stage (screen, full, gate) is all 1819 items, scored greedily; no draws, no separate gate set.
# Candidate score = eval accuracy / incumbent's (kl_weight 0: no KL); accepted when the eval-set score is
# strictly higher (gate.min_delta 1e-6, no significance test). KL / calibration texts = 400 eval prompts + M_0's
# answers. The editor's regression examples also show the reference answer.
#
# Launch:
#   ./launch.sh --hw h20 --paper A --domains math --gens 5 --gpus 0,1,2,3 --eval-overfit
# Run id: A_math_s42_single_evalfit
draw_config: data/draw/paper_a.yaml
data:
