# Paper A · math · 8 GPUs (B300) · 8 threads x 1 step · up to 30 tool rounds per candidate · objective simple v2
# self-quantization: the frozen M_0 writes quantization configs (fixed W4-size budget); the incumbent is the latest model.
# Generated (2026-11-21) from the merged config: edit_code/configs/base.yaml + domains/math.yaml + hardware b300 + scope single
# + objective simple + --set editor.tool_rounds=30. Not read by the code; the run locks its own copy in
# experiment_records/A_math_s42_single_simple_r30/run_config.yaml.
#
# Runnable experiment file (overrides only, hardware from --hw): plan/configs/run/A_math_r30_nosig.yaml
#   ./launch.sh --hw b300 --paper A --domains math --gens 5 --gpus 0,1,2,3,4,5,6,7 --config plan/configs/run/A_math_r30_nosig.yaml --tag r30_nosig
# Equivalent with --set (one experiment uses all 8 GPUs):
#   ./launch.sh --hw b300 --paper A --domains math --simple --gens 5 --gpus 0,1,2,3,4,5,6,7 --tag r30 --set editor.tool_rounds=30
# Without the significance test (nosig):
#   ./launch.sh --hw b300 --paper A --domains math --simple --gens 5 --gpus 0,1,2,3,4,5,6,7 --tag r30_nosig --set editor.tool_rounds=30 --set gate.require_significant=false
# H20 (110 GB): replace --hw b300 with --hw h20.
#
# GPU roles: GPU 0 = editor (M_0, vLLM; sleeps while candidates are evaluated and lends its GPU); GPUs 1-7 = 7 candidate
#   servers (each candidate's gate evaluation and the incumbent's screen / gate / test runs are spread over them)
# Data (simple_data/math/): gate = simple_math_eval (500 fixed, hidden: the editor sees only statistics of earlier
#   candidates' gate results); test = simple_math_test (500 fixed, held-out report only); screen = 500 items drawn afresh
#   each generation from the dapo_math pool minus gate and test; train = all remaining pool items (~13,200).
# Each generation:
#   1. the latest model answers the 500 screen items 4 times each, once; the editor sees the detailed results (summary in
#      every message; screen_results / screen_output tools incl. the thinking text);
#   2. 8 independent sessions (search.threads 8, steps 1), each up to editor.tool_rounds 30 rounds of tool calls in ONE
#      persistent Python session (editor.explore.persistent), then a program (no api.evaluate) -> one candidate;
#   3. each candidate: ONE gate evaluation (500 x 4, paired with the latest model); statistics visible to later sessions;
#   4. accept the candidate with the largest paired gate gain >= gate.min_delta 0.0 (any strictly positive gain) (require_significant True
#      here; the nosig command sets it false); then the test set (500 x 4).
# Decoding (screen / gate / test): thinking on, temperature 0.6, top_p 0.95, top_k 20, max_tokens 16384.
