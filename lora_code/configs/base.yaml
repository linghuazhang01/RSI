# Paper B (self-written LoRA) base config. Merged with configs/domains/<domain>.yaml and --set KEY=VALUE
# by rsicore.config.load_run_config; locked in experiment_records/<run-id>/run_config.yaml.
# Numbers marked [pilot] are assumptions to be fixed in B-P0 (RSI_LOOP_DESIGN §6).
# The one flow (2026-11-22; the former objective simple, scope single): simple_data/<domain>
# (data/scripts/make_simple_data.py, sampled from the decontaminated training pool). Every generation rsicore.draws
# draws a FRESH screen of simple.screen_n (500) items from the clean pool (simple_<d>_pool minus the 500 gate and 500
# test items; seeded by the search round, so Paper A and B screen the same items); train = the rest of the pool
# (train_example / acts / train_loss; 13,238 items for math, ~72k for knowledge). The gate is simple_<d>_eval (500,
# paired vs the current model), the held-out report simple_<d>_test (500). Only the run's --domain is trained, gated
# and evaluated. Scoring samples in Qwen3 thinking mode (0.6 / 0.95 / top_k 20, 16384 tokens, the run seed for
# reference and candidates alike; `decoding`, heldout.decoding). Flow per generation: the CURRENT model answers the
# screen items once (n 4; the editor sees a summary in every step and every item / full output, thinking included,
# through api.screen_results / api.screen_output / acts(source='own')); candidates are NOT screened; each of the
# search.threads x search.steps candidates (8 x 1 here) gets ONE gate evaluation (500 x 4, paired vs the current
# model's gate records, computed once per generation), shown to later steps / generations; at the end the passing
# candidate with the largest paired gain is accepted; then the test set (500 x 4). No api.evaluate (2026-11-23: this
# flow is hard-wired, the knobs of the other variants are gone). Cost: 8 candidates x 500 x 4 thinking samples on the
# gate set per generation. Run ids
# end in _single_simple. Every Paper B scoring server is a main replica / weights slot with --max-model-len >= 32768
# (editor.context_tokens), so prompt + 16384 fits.
simple:
  screen_n: 500             # screen items drawn per generation (rsicore.draws.simple_screen_n)

# Max generation length (tokens) per eval task, for EVERY model call of this run that does not set its own (the
# scoring decodings below set max_tokens 16384): training-answer sampling. Overrides eval/configs/tasks.yaml (passed to run_eval as --max-tokens); tasks not
# listed keep their tasks.yaml value. e.g. --set max_tokens.dapo_math=2048
max_tokens:
  dapo_math: 4096
  taco_verified: 4096
  ifeval_train: 2048
  sealtool_train: 1024
  triviaqa_train: 1024

# How the editor changes the model each generation (2026-11-21). The default never trains: the editor has no
# training or gradient tools (no sgd / grad / from_grad) in any mode.
#   scratch (default) : write a LoRA from zero with SVD / activation statistics / constructions; candidates are
#             hot-loaded on the main replicas. Gate = vs the current model (paired, + gate.min_gain), every candidate;
#             fallback = keep; an accepted LoRA becomes part of the model as merge.mode says (below).
#   weights : edit the weights directly with structured, any-rank operations (row / column / module scaling,
#             dense low-rank additions built with the LoRA tools, moving modules toward the original weights;
#             per-module ||W'-W||/||W|| <= weights.norm_cap_tau). A candidate is exported (only edited shards
#             rewritten) and served on a free candidate slot: the main groups after the first (4 GPUs: editor
#             [0], slots [1], [2] + the editor's GPU while it sleeps; train [3]). Same gate / fallback as scratch.
#   edit    : the one mode that trains: generation 0 trains ONE raw LoRA with the fixed `raw` recipe below,
#             later generations edit it (M_g = M_0 + L_g, adapter, never merged). Gate: every candidate vs the
#             current model + gate.min_gain; fallback in generation 0 = the raw LoRA if it passes the same gate, later
#             keep L_g.
method:
  mode: scratch             # scratch | weights | edit

weights:                    # method.mode weights
  norm_cap_tau: 0.05        # [pilot] per-module ||W' - W||_F / ||W||_F cap of an edit (dense, any rank)
  max_modules: null         # max modules one edit may touch (null = no limit)
  # (2026-11-21, tensor_compute writes) 1-D tensors (norms, dt_bias, A_log): rms(W' - W) <= vector_cap_tau *
  # max(rms(W), 1) (Qwen3.5's RMSNorm weights are zero-centred: the layer multiplies by 1 + w, so a purely relative
  # cap is meaningless); a dense delta within rescale_tol of a uniform rescale of W (||D - cW|| / ||D||) is refused
  vector_cap_tau: 0.5
  rescale_tol: 0.05

raw:                        # mode=edit only: recipe of the raw LoRA (trained once, generation 0; the only training)
  n_train: null             # train items used (deterministic subset; null = all of generation 0's train items)
  rank: 16
  lr: 1.0e-4
  epochs: 1.0
  steps: null               # null = epochs over the n_train items (capped by gpu_seconds)
  batch_size: 4
  leaves: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj, gate_proj, up_proj, down_proj]
  gpu_seconds: null         # null = budget.gpu_seconds

lora:
  rank_cap: 64              # [pilot] max rank per module of a candidate (vLLM --max-lora-rank; merge.mode adapter: see merge)
  norm_cap_tau: 0.1         # [pilot] per-module ||dW||_F / ||W0||_F cap
  allowed_leaves: null      # null = every vLLM-LoRA-capable Qwen3.5 projection (see primitives/naming.py)
  save_dtype: bfloat16      # adapter_model.safetensors dtype

budget:
  gpu_seconds: 7200         # [pilot] per generation: the editor's activation statistics (acts / train_loss);
                            # also the raw LoRA's training budget unless raw.gpu_seconds is set

# threads x steps are parameters (the prompts use the configured numbers). The flow above is hard-wired (2026-11-23):
# candidates are never screened, each gets ONE gate evaluation during the search (paired vs the current model;
# gen_XX/gate.json), the passing one with the largest paired gain is accepted; no api.evaluate
search:
  threads: 8
  steps: 1
  archive: true             # experience channel: every earlier candidate, one row each (what, gate, error, note;
                            # 2026-11-22); full programs via read_record. archive_chars (code default 30000) caps it
  max_candidates: 8         # candidate cap per generation (null = threads x steps)
  parallel_builds: true     # with several main replicas, up to that many candidates are built at once (non-weights
                            # modes; weights mode always uses its slots)

# The editor (2026-11-21): Qwen3 thinking mode + a tool loop while it writes each candidate (rsicore.editor /
# rsicore.chat_tools). One round = one model turn that made function calls; after tool_rounds
# (or a guard) one forced final turn without tools. The proposal ends with a reply WITHOUT function calls holding one
# ```python block. Chat tools: run_python(code) (sandbox, the workspace's exploration api: no raw_lora,
# no GPU tools unless explore.gpu_tools; spends no budget; handles freed after each call) and read_record(cid, part).
# search_history (2026-11-21, on by default; code default history_tool: true, --set editor.history_tool=false removes
# it): every candidate already tried (this generation's and all earlier generations'), one row each with strategy,
# modules, rank, tools used, target gain, scores, gate outcome, same_as = identical LoRA digest; read_record then also
# opens earlier generations' records.
editor:
  temperature: 0.6          # Qwen3 thinking-mode sampling
  top_p: 0.95
  extra_body: {chat_template_kwargs: {enable_thinking: true}, top_k: 20, min_p: 0.0}   # {} = template default
  max_tokens: 16384         # final answer turn (thinking + plan + program); was 8192
  tool_rounds: 20           # tool rounds per candidate (the prompt states it); 0 = one call per candidate (no tools in
                            # the request, the old prompt text)
  turn_max_tokens: 8192     # each tool turn (thinking + function calls)
  max_tool_calls: 100       # individual calls per proposal (parallel calls count one by one)
  proposal_tokens: 160000   # completion tokens per proposal, then the final turn is forced
  proposal_wall_s: 2400     # wall clock per proposal (model + tools), then the final turn is forced
  context_tokens: 131072    # THE context-length knob: clamps each turn's max_tokens, sets when to compact, and is
                            # written as --max-model-len into server.main_args (the main replicas host the editor;
                            # weights mode: the candidate-slot servers too). It overrides a --max-model-len in
                            # main_args; null = read it from main_args. See hardware_profiles.
  tool_result_chars: 6000   # each tool result is cut to this many chars in the chat (full output on disk)
  compact_at: 0.6           # estimated prompt > 0.6 x context_tokens -> drop older reasoning / elide older tool output
  keep_tool_rounds: 8
  keep_reasoning_rounds: 2
  reasoning_passback: think_tag   # in-loop reasoning sent back as <think>..</think> | field | drop
  history_keep: 2           # cross-step history: step 0 + the last 2 steps in full, code only in between; null = all
                            # (ignored when tool_rounds is 0: the full history, as before)
  timeout_s: 3600           # per HTTP request
  mock_tool_rounds: 1       # --mock: run_python calls of the mock editor before its program
  explore:                  # run_python
    timeout_s: 300
    mem_gb: 8
    gpu_tools: true         # acts (also on own outputs) / train_loss allowed while exploring, charged to
    gpu_seconds: 600        # this separate budget (2026-11-22: per session / candidate; never the generation's)
    persistent: true        # one Python session per candidate: variables / handles persist across run_python calls
                            # (rsicore.chat_tools)

sandbox:
  timeout_s: 1800
  mem_gb: 16

feedback:                   # score = the paired target gain vs the current model
  n_examples: 3             # error examples per feedback
  mark_shown: true          # record them in gen_XX/shown.json

loop:
  patience: 3               # stop after this many consecutive generations whose gate kept the current model
                            # (2026-11-20; null = always run --gens generations)

tools:                      # editor tools that can be switched off (ablations)
  compare: true             # item-level comparison with the current model (ids / statistics only)
  train_loss: true          # mean answer NLL on train items under a LoRA (forward only, costs gpu_seconds)
  train_loss_backend: vllm  # (2026-11-22) hf = the HF model (the session's tool device or the train GPU); vllm = the
                            # LoRA hot-loaded on the session's own main replica, NLL from prompt logprobs (charged by
                            # wall clock). Weight edits, a parent LoRA (mode=edit) and mock always use hf
  tensor_compute: true      # (2026-11-21) api.tensor_compute / api.tensors (absent = on)
  paper_tools: true         # (2026-11-21) save_edit / load_edit / list_edits / drop_edit, output_matrices, unit,
                            # direction, project_out, acts(source='own'), tensor_compute(vectors=...) (absent = on)
  # screen_results: (2026-11-21) absent = on: screen_results / screen_output

# api.tensor_compute(code, tensors) (2026-11-21, every mode; on when tools.tensor_compute):
# CPU torch code in a fresh sandbox process on fp32 copies of the CURRENT model's tensors (any language-model tensor,
# api.tensors()); it returns JSON, vectors (handle T<n>, refs "T<n>.name" for rank1 / from_direction), LoRA factors
# (handle L<n>) or, in mode=weights, dense writes (delta ops on a W edit, capped by weights.*).
tensor_compute:
  max_tensors: 4            # tensors per call
  timeout_s: 300            # per call; never longer than the calling program's / run_python call's time left
  mem_gb: 16                # address-space limit of the child
  threads: 4                # OMP / MKL / torch threads of the child (CUDA hidden)
  max_concurrent: 2         # jobs at once in the whole process (a semaphore; others wait within their timeout)
  result_chars: 4000        # the JSON result is cut to this many characters
  explore: true             # also offered in the run_python exploration api (no budget spent)
  max_input_mb: 8192        # fp32 MB of all input tensors of one call

# Scoring decoding per stage (2026-11-21; rsicore.config.stage_decoding): null = each task's eval/configs/tasks.yaml
# decoding (greedy). A dict takes temperature, top_p, top_k, n (avg@n per item), thinking, max_tokens, seed (null =
# the run's --seed). The same dict scores the current model (parent / M_0 references, sampled once per generation)
# and every candidate. full falls back to screen. Qwen3 thinking-mode sampling.
decoding:
  screen: {temperature: 0.6, top_p: 0.95, top_k: 20, thinking: true, max_tokens: 16384, n: 4, seed: null}
  gate: {temperature: 0.6, top_p: 0.95, top_k: 20, thinking: true, max_tokens: 16384, n: 4, seed: null}

gate:                       # every candidate vs the current model (paired per item on the gate set; 2026-11-23: no
                            # other reference)
  fallback: auto            # nothing passed: auto = by method.mode (edit: raw in generation 0 = the raw LoRA if it
                            # passes the same gate, scratch / weights: keep) | raw | keep
  min_gain: 0.0             # mean PAIRED gain on the gate items >= min_gain; 0 = any strictly positive paired gain
                            # (2026-11-21)
  require_significant: true # and the paired gain's 95% CI lower bound > 0 (like Paper A)
  delta: 0.02               # [pilot] learned target: gate score >= the last accepted candidate's gate score - delta

eval:                       # items scored (null = all of the draw / gate set): screen = the current model's screen,
  screen_limit: null        # full = the non-LLM branch's / raw LoRA's full level, gate = every candidate's gate
  full_limit: null
  gate_limit: null

train_data:                 # answers for training: used only when the raw LoRA is trained (mode=edit, generation 0);
                            # otherwise the train items get gold answers and nothing is sampled
  mode: self_correct        # 2026-11-20: rejection-sampled own correct answers only; an item with no correct
                            # sample is skipped (self_correct_then_gold: use the gold answer instead; gold: no
                            # sampling). Prompt = the evaluator's own chat messages + Qwen template, thinking off
  samples: 4                # samples per train item; the first correct one is the training answer
  temperature: 0.7          # 2026-11-20: Qwen's non-thinking sampling (0.7 / 0.8 / top_k 20)
  top_p: 0.8
  top_k: 20

train:
  dtype: bfloat16
  max_len: 4608             # tokens per training sequence = prompt + answer; answers are capped at 4096 tokens
                            # (dapo_math / taco_verified max_tokens), +512 for the prompt so no answer is cut
  micro_batch: null         # forward at most this many sequences at once (gradient accumulation); null = whole batch

nonllm:                     # 4th branch, as many candidates as the editor; what it searches depends on method.mode:
                            #   edit: random rule-based edits of the raw LoRA (scale / truncate / intruder / prune)
                            #   scratch: random gradient-free constructions (singular-direction scaling)
  evaluate: 8               # the same candidate count as the editor
  # (2026-11-21, read with these defaults, not written here so earlier locked run configs still resume):
  #   enabled: true           # --set nonllm.enabled=false: never run the non-LLM branch
  #   skip_if_rejected: true  # skip it in a generation whose gate kept the current model (nothing to compare with)
  search_scales: [0.5, 0.75, 1.0, 1.25]   # edit: global scales the random edits draw from

diagnostics:
  svd_k: 8

heldout:                    # simple_<domain>_test (500 items never screened or gated; rsicore.heldout)
  enabled: true
  limit: null
  # Held-out decoding: the scoring decoding (thinking sampling); seed null = the run's --seed; avg@n.
  # null = each task's tasks.yaml decoding (greedy).
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    thinking: true
    max_tokens: 16384
    n: 4
    seed: null
    n_by_task: null

merge:
  gpu: true                 # accumulate W + dW on gpu1 (else CPU)
  # (2026-11-22, method.mode scratch) How an accepted LoRA becomes the next model. Code defaults, no live keys here
  # (paper_cfg is locked, so runs started earlier resume unchanged); set them with --set or a run config:
  #   mode: merge             merge (default) = W' = W + B A in fp32, cast to bf16, written as gen_XX/model and served
  #                           as m{g+1} after a vLLM restart (bf16 rounding can swallow small dW: the gated adapter
  #                           and the merged successor differ; model.json max_realised_rel_err).
  #                           adapter = never merged: M_g = M_0 + C_g, C_g = every accepted LoRA rank-concatenated
  #                           (gen_XX/cumulative_lora, fp32), served as ONE adapter on the M_0 server for the whole
  #                           run (no restart, no checkpoint). A candidate is served as C_g (+) its delta, so the gate
  #                           scores exactly the next model; HF / weight tools see W_0 + B_C A_C (fp32 overlay).
  #                           mode=edit is adapter-only (ignored there); mode=weights refuses adapter.
  #   adapter_rank_budget: 256  adapter: max rank per module of C_g; a composite above it is re-factored by exact SVD
  #                           and truncated BEFORE it is registered (gated = kept). The main servers start with
  #                           --max-lora-rank padded(max(budget, lora.rank_cap)) (default 256; vLLM max 512): vLLM
  #                           reserves max_loras x that rank of LoRA buffers, so check the KV / memory budget (or
  #                           lower server.max_loras) on H20; decoding through the adapter is also slower.

server:
  max_loras: 8
  main_args: ["--gpu-memory-utilization", "0.85", "--max-logprobs", "20"]
  mock_tasks: null

# GPU roles (lora_code/common.py gpu_layout). gpu_roles unset = EVERY GPU of --gpus is used: train = the last
# gpu_layout.train_gpus GPUs, main = all other GPUs as replicas (gpu_layout.main_replicas). Set gpu_roles (indices into --gpus) only to override,
# e.g. --set 'gpu_roles.train=[2,3]' (then main is a single tensor-parallel server).
gpu_roles: null
gpu_layout:
  share_single_gpu: false
  main_replicas: true       # 2026-11-20: main = independent vLLM replicas (data parallelism), every LoRA loaded on
                            # all of them; scoring split over them, editor thread k on replica k mod n
  main_tp: 1                # GPUs per main replica (tensor parallelism inside a replica)
  train_gpus: 1             # GPUs of the train role (HF model: SVD / acts / train_loss / merge / edit's raw LoRA)
                            # 4 GPUs: main [0, 1, 2] (3 replicas) | train [3]
  tools_on_replicas: false  # (2026-11-22) true: every main replica's GPU also holds an HF copy of the current model and
                            # a weight store; editor session k runs its tools there (replica k mod n, the one its
                            # editor uses), so sessions on different replicas do not queue on the train GPU. The
                            # train GPU keeps diagnostics, merge and the baselines. Not in mode=weights.
  replica_vllm_gib: null    # with tools_on_replicas: the main replicas' --rsi-gpu-memory-gib (room for the HF copy)

# Hardware profile (--set hardware=h20, or ./launch.sh --hw h20). The defaults above assume 288 GB B300
# cards; the b300 profile plans them at 220 GB (2026-11-21). rsicore.config merges the profile over base/domain
# config and BEFORE --set (--set wins).
hardware: b300
hardware_profiles:
  b300:                     # B300 (~270 GB visible) PLANNED AT 220 GB per card (2026-11-21)
    server:                 # --rsi-gpu-memory-gib -> --gpu-memory-utilization = GB / card total (rsicore.servers;
      # the utilization given is the fallback without nvidia-smi, = GB / 270). main: 220 - 52 GB weights - ~6 GB
      # runtime - LoRA slots leaves ~150 GB KV (editor threads at 131072 tokens + scoring).
      main_args: ["--rsi-gpu-memory-gib", "220", "--gpu-memory-utilization", "0.81", "--max-model-len", "131072",
                  "--max-num-seqs", "128", "--max-logprobs", "20"]   # --max-model-len = editor.context_tokens
    editor: {context_tokens: 131072}   # main replicas --max-model-len 131072
    # (2026-11-22) tools on the replicas: vLLM 140 GB (52 GB weights + ~80 GB KV) + the HF copy (52 GB) + tool
    # activations (~30 GB: acts / grams forward with ~248k-vocab logits) ~ 222 GB of the ~270 GB visible
    gpu_layout: {tools_on_replicas: true, replica_vllm_gib: 140}
  h20:                      # H20 cards (~140 GB) PLANNED AT 110 GB each (2026-11-20); Qwen3.8-27B BF16 ~52 GB
    server:                 # --rsi-gpu-memory-gib 110 -> --gpu-memory-utilization = 110 GB / card total (rsicore.servers)
      max_loras: 8          # ~0.8 GB per rank-64 adapter slot [estimate]
      main_args: ["--rsi-gpu-memory-gib", "110", "--gpu-memory-utilization", "0.78", "--max-model-len", "131072",
                  "--max-num-seqs", "128", "--max-logprobs", "20"]   # --max-model-len = editor.context_tokens
    editor: {context_tokens: 131072}   # main replicas host the editor: 2 threads x 8 GiB KV fits (was 20480)
    train:
      micro_batch: 2        # [pilot] 52 GB weights + 2 x (4k tokens: fp32 logits + grad + log-softmax ~12 GB,
                            # checkpointed activations ~1.5 GB) ~ 80 GB; raise after the smoke run's memory peak
  h20_80:                   # 80 GB H20 (the earlier plan)
    server:
      max_loras: 4          # vLLM reserves GPU memory for max_loras adapters of rank_cap
      main_args: ["--gpu-memory-utilization", "0.92", "--max-model-len", "49152", "--max-num-seqs", "32", "--max-logprobs", "20"]
    editor: {context_tokens: 49152}    # ~15 GB KV per replica: 131072 does not fit (was 20480); compaction does the rest
    train:
      micro_batch: 1        # 52 GB weights + one 4k-token sequence (activations, fp32 logits) per forward

mock:
  base_quality: 0.6
  sec_per_example: 0.6

# Applied on top of everything (after --set) when --mock is given: small budgets so a laptop run takes minutes
# (k sessions x 1 step).
mock_overrides:
  search: {threads: 3, steps: 1, max_candidates: 3}
  budget: {gpu_seconds: 600}
  eval: {screen_limit: 20, full_limit: 30, gate_limit: 30}
  train_data: {mode: gold}
  nonllm: {evaluate: 2, search_scales: [0.75, 1.0]}
  heldout: {limit: 20}
  sandbox: {timeout_s: 120, mem_gb: 4}
  editor: {explore: {timeout_s: 60, mem_gb: 4}}   # mock_tool_rounds (1) run_python calls per proposal
