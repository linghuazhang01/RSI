# Paper B (self-written LoRA) base config. Merged with configs/domains/<domain>.yaml and --set KEY=VALUE
# by rsicore.config.load_run_config; locked in experiment_records/<run-id>/run_config.yaml.
# Numbers marked [pilot] are assumptions to be fixed in B-P0 (RSI_LOOP_DESIGN §6).
draw_config: data/draw/paper_b.yaml   # target/retention sizes (n, target_train_frac, retention_n, screen_n, retention_kl, gate_n)

# Data size of every step (null = keep the draw config's value). The draw sizes below override
# data/draw/paper_b.yaml for this run (written to <run>/draw_config.effective.yaml and locked with the run).
# n / gate_n: a number (every domain) or {math: 1000, code: 500}. Other step sizes live next to their step:
#   raw.n_train (edit-mode raw LoRA), baseline.noise_n (noise re-runs), eval.*_limit (screen /
#   full / gate / KL items scored per candidate), heldout.limit, e_t.n_train / n_signal / test_limit.
data:
  n: null                   # items drawn per generation for the target domain (train + signal)
  target_train_frac: null   # share of those items used for training (the rest = signal)
  screen_n: null            # first-stage (screen) subset of the signal items
  gate_n: null              # fixed gate items per domain
  retention_n: null         # scope=all: signal items per retention domain
  retention_kl: null        # scope=all: token-KL prompts per retention domain

# Max generation length (tokens) per eval task, for EVERY model call of this run: candidates, gate, noise
# re-runs, training-answer sampling. Overrides eval/configs/tasks.yaml (passed to run_eval as --max-tokens); tasks not
# listed keep their tasks.yaml value. e.g. --set max_tokens.dapo_math=2048
max_tokens:
  dapo_math: 4096
  taco_verified: 4096
  ifeval_train: 2048
  sealtool_train: 1024
  triviaqa_train: 1024
  math_eval: 4096                     # objective eval_overfit (MATH-500 + GSM8K test)

# How the editor changes the model each generation (2026-11-21). The default never trains: the editor has no
# training or gradient tools (no sgd / grad / from_grad) in any mode.
#   scratch (default) : write a LoRA from zero with SVD / activation statistics / constructions; candidates are
#             hot-loaded on the main replicas. Gate reference = the current model (paired, + gate.min_gain);
#             fallback = keep; an accepted LoRA is merged into the weights.
#   weights : edit the weights directly with structured, any-rank operations (row / column / module scaling,
#             dense low-rank additions built with the LoRA tools, moving modules toward the original weights;
#             per-module ||W'-W||/||W|| <= weights.norm_cap_tau). A candidate is exported (only edited shards
#             rewritten) and served on a free candidate slot: the main groups after the first (4 GPUs: editor
#             [0], slots [1], [2] + the editor's GPU while it sleeps; train [3]). Same gate / fallback as scratch.
#             No E_t (scope single).
#   edit    : the one mode that trains: generation 0 trains ONE raw LoRA with the fixed `raw` recipe below,
#             later generations edit it (M_g = M_0 + L_g, adapter, never merged). Gate: generation 0 vs the raw
#             LoRA (fallback raw); later vs the current model + gate.min_gain (fallback keep L_g).
method:
  mode: scratch             # scratch | weights | edit

weights:                    # method.mode weights
  norm_cap_tau: 0.05        # [pilot] per-module ||W' - W||_F / ||W||_F cap of an edit (dense, any rank)
  max_modules: null         # max modules one edit may touch (null = no limit)

# Domain scope (default single since 2026-11-19; --set scope=all or ./launch.sh --all-domains for the original
# design). single = ONLY the run's --domain: training, gate, feedback and token-KL use the target domain only
# (no retention probes), held-out on the target domain's benchmarks only, E_t (a different-domain task) off.
# all = the target domain is trained / gated, the other four domains are retention probes, held-out covers all
# five domains, E_t on. Merged before --set, so e.g. --set e_t.enabled=true still wins.
scope: single
scope_profiles:
  all: {}
  single:
    retention: {domains: []}
    heldout: {domains: run}
    e_t: {enabled: false}   # (no E_t -> no theta0 server: the GPU layout needs only main + train)

# Objective (2026-11-20; --set objective=eval_overfit, or ./launch.sh --eval-overfit). train_gate = the train /
# signal / gate split above. eval_overfit = optimise directly on ONE eval set (eval_target.dataset, e.g. math =
# MATH-500 + GSM8K test, 1819 items; humanevalplus; ifeval; built by data/scripts/build_eval_target.py as K_eval);
# train / signal / gate and the held-out evaluation are all of it (the editor sees every item: train_example, acts,
# train_loss), scored greedily; a candidate is accepted when its eval-set score is strictly higher than the current
# model's (no significance test, no separate gate set). Run ids end in _evalfit (math) or _evalfit_<set>. Merged before --set (explicit --set values still win).
objective: train_gate
objective_profiles:
  train_gate: {}
  eval_overfit:
    # dataset: the eval set (2026-11-21: any single one, a key of eval/configs/tasks.yaml eval_targets, e.g. math
    # = MATH-500 + GSM8K test, humanevalplus, ifeval, gpqa_diamond); null = the domain's default
    # (math -> math, code -> humanevalplus, knowledge -> gpqa_diamond, instruction_following -> ifeval,
    # tool_calling -> sealtool). Must belong to the run's --domain.
    eval_target: {enabled: true, dataset: null}
    retention: {domains: []}
    search: {top_full: 0}                   # screen = full = the whole set
    gate: {min_gain: 1.0e-6, require_significant: false}         # accept any strictly higher eval-set score
    feedback: {n_examples: 5, lambda_kl: 0.0}
    heldout: {domains: eval_target, decoding: null}   # evaluated on the same eval set, greedy (2026-11-21)
    e_t: {enabled: false}
  # simple (2026-11-21; ./launch.sh --simple): simple_data/<domain> (data/scripts/make_simple_data.py, sampled from the
  # decontaminated training pool): train on its 1,500 items (train_example / acts / train_loss, signal / screen = all
  # of them every generation), accept on its 500 (the usual paired gate vs the current model), and the held-out report
  # is the same 500 items (data_roles.eval = gate, greedy like the gate). The editor gets at most 20 tool rounds per
  # candidate (context editor.context_tokens = 131072 from the hardware profile). Run ids end in _simple.
  simple:
    data_roles: {eval: gate}  # held-out evaluation = simple_<domain>_eval (the 500 gate items)
    retention: {domains: []}
    heldout: {enabled: true, decoding: null}   # greedy (each task's tasks.yaml decoding)
    e_t: {enabled: false}
    editor: {tool_rounds: 20}

raw:                        # mode=edit only: recipe of the raw LoRA (trained once, generation 0; the only training)
  n_train: null             # train items used (deterministic subset; null = all of generation 0's train items =
                            # data.n x data.target_train_frac; raise data.n for more)
  rank: 16
  lr: 1.0e-4
  epochs: 1.0
  steps: null               # null = epochs over the n_train items (capped by gpu_seconds)
  batch_size: 4
  leaves: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj, gate_proj, up_proj, down_proj]
  gpu_seconds: null         # null = budget.gpu_seconds

lora:
  rank_cap: 64              # [pilot] max rank per module (vLLM --max-lora-rank)
  norm_cap_tau: 0.1         # [pilot] per-module ||dW||_F / ||W0||_F cap
  allowed_leaves: null      # null = every vLLM-LoRA-capable Qwen3.5 projection (see primitives/naming.py)
  save_dtype: bfloat16      # adapter_model.safetensors dtype

budget:
  gpu_seconds: 7200         # [pilot] per generation: the editor's activation statistics (acts / regmean_preserve);
                            # also the raw LoRA's training budget unless raw.gpu_seconds is set

search:
  threads: 4
  steps: 8
  max_evaluate: 32          # evaluate calls per generation (every candidate costs 1)
  top_full: 3               # top screened candidates re-scored on the full signal draw
  rerun_seeds: 0
  archive: true             # experience channel: show earlier generations' best programs

# The editor (2026-11-21): Qwen3 thinking mode + a tool loop while it writes each candidate (rsicore.editor /
# rsicore.chat_tools; also the E_t editor). One round = one model turn that made function calls; after tool_rounds
# (or a guard) one forced final turn without tools. The proposal ends with a reply WITHOUT function calls holding one
# ```python block. Chat tools: run_python(code) (sandbox, the workspace's exploration api: no evaluate / raw_lora,
# no GPU tools unless explore.gpu_tools; spends no budget; handles freed after each call) and read_record(cid, part).
editor:
  temperature: 0.6          # Qwen3 thinking-mode sampling
  top_p: 0.95
  extra_body: {chat_template_kwargs: {enable_thinking: true}, top_k: 20, min_p: 0.0}   # {} = template default
  max_tokens: 16384         # final answer turn (thinking + plan + program); was 8192
  tool_rounds: 50           # 0 = one call per candidate (no tools in the request, the old prompt text)
  turn_max_tokens: 8192     # each tool turn (thinking + function calls)
  max_tool_calls: 100       # individual calls per proposal (parallel calls count one by one)
  proposal_tokens: 160000   # completion tokens per proposal, then the final turn is forced
  proposal_wall_s: 2400     # wall clock per proposal (model + tools), then the final turn is forced
  context_tokens: 131072    # THE context-length knob: clamps each turn's max_tokens, sets when to compact, and is
                            # written as --max-model-len into server.main_args (the main replicas host the editor;
                            # weights mode: the candidate-slot servers too). It overrides a --max-model-len in
                            # main_args; null = read it from main_args. theta0_args unchanged. See hardware_profiles.
  tool_result_chars: 6000   # each tool result is cut to this many chars in the chat (full output on disk)
  compact_at: 0.6           # estimated prompt > 0.6 x context_tokens -> drop older reasoning / elide older tool output
  keep_tool_rounds: 8
  keep_reasoning_rounds: 2
  reasoning_passback: think_tag   # in-loop reasoning sent back as <think>..</think> | field | drop
  history_keep: 2           # cross-step history: step 0 + the last 2 steps in full, code only in between; null = all
                            # (ignored when tool_rounds is 0: the full history, as before)
  timeout_s: 3600           # per HTTP request
  mock_tool_rounds: 1       # --mock: run_python calls of the mock editor before its program
  explore:                  # run_python
    timeout_s: 300
    mem_gb: 8
    gpu_tools: false        # true: acts / train_loss / regmean_preserve allowed while exploring, charged to
    gpu_seconds: 300        # this separate budget (per search; never the generation's gpu_seconds)

sandbox:
  timeout_s: 1800
  mem_gb: 16

feedback:
  lambda_retention: 1.0     # [pilot] score = target_gain - lambda * mean retention drop - lambda_kl * KL
  lambda_kl: 0.5
  n_examples: 3             # error / regression examples per feedback (marked as shown -> never signal again)
  mark_shown: true

retention:
  domains: null            # null = all non-target domains; [] = target-domain training/evaluation only (scope=single)

loop:
  patience: 3               # stop after this many consecutive generations whose gate kept the current model
                            # (2026-11-20; null = always run --gens generations)

tools:                      # editor tools that can be switched off (ablations)
  compare: true             # item-level comparison with the current model (ids / statistics only)
  train_loss: true          # mean answer NLL on train items under a LoRA (forward only, costs gpu_seconds)

gate:
  reference: auto           # auto = by method.mode (edit: raw, scratch: parent) | raw | parent
  fallback: auto            # auto = by method.mode (edit: raw, scratch: keep) | raw | keep
  min_gain: 0.01            # [pilot] reference=parent: mean PAIRED gain on the gate items >= min_gain (2026-11-20)
  require_significant: true # reference=parent: and the paired gain's 95% CI lower bound > 0 (like Paper A)
  epsilon: 0.01             # [pilot] reference=raw: target gate >= raw gate - epsilon
  delta: 0.02               # [pilot] retention gate >= gen-0 - max(delta, noise band); learned targets >= post-learning - delta
  use_noise_band: true
  max_submissions: 3

eval:                       # null = use the draw config sizes as they are
  screen_limit: null
  full_limit: null
  gate_limit: null
  kl_limit: null

train_data:                 # answers for training: used only when the raw LoRA is trained (mode=edit, generation 0);
                            # otherwise the train items get gold answers and nothing is sampled
  mode: self_correct        # 2026-11-20: rejection-sampled own correct answers only; an item with no correct
                            # sample is skipped (self_correct_then_gold: use the gold answer instead; gold: no
                            # sampling). Prompt = the evaluator's own chat messages + Qwen template, thinking off
  samples: 4                # samples per train item; the first correct one is the training answer
  temperature: 0.7          # 2026-11-20: Qwen's non-thinking sampling (0.7 / 0.8 / top_k 20), like the held-out
  top_p: 0.8                # evaluation; search, gate and noise are greedy
  top_k: 20

train:
  dtype: bfloat16
  max_len: 4608             # tokens per training sequence = prompt + answer; answers are capped at 4096 tokens
                            # (dapo_math / taco_verified max_tokens), +512 for the prompt so no answer is cut
  micro_batch: null         # forward at most this many sequences at once (gradient accumulation); null = whole batch

nonllm:                     # 4th branch, same evaluate budget as the editor; what it searches depends on method.mode:
                            #   edit: random rule-based edits of the raw LoRA (scale / truncate / intruder / prune / regmean)
                            #   scratch: random gradient-free constructions (singular-direction scaling)
  evaluate: 32              # same evaluate budget as the editor
  # (2026-11-21, read with these defaults, not written here so earlier locked run configs still resume):
  #   enabled: true           # --set nonllm.enabled=false: never run the non-LLM branch (no E_t nonllm branch either)
  #   skip_if_rejected: true  # skip it in a generation whose gate kept the current model (nothing to compare with)
  search_scales: [0.5, 0.75, 1.0, 1.25]   # edit: global scales the random edits draw from

diagnostics:
  svd_k: 8

e_t:
  enabled: true
  task: tool_calling                       # E-Seal: sealtool_train -> Seal-Tools test + BFCL
  task_when_target_is_tool_calling: code   # taco_verified -> LiveCodeBench
  branches: [parent, llm, nonllm]         # mode=edit adds raw (M_t ⊕ raw, the ΔE_write reference)
  evaluate: 16
  gpu_seconds: 3600         # [pilot] per E session (acts / regmean); mode=edit: also the E-task raw LoRA's training
  threads: 4
  steps: 4
  top_full: 1
  n_train: 1600
  n_signal: 200
  items_seed: 20261118
  test_limit: null

heldout:
  enabled: true
  domains: all             # all | run (= the run's --domain; scope=single) | a domain list, e.g. math
  limit: null
  # Held-out decoding (2026-11-20): sampled, Qwen's non-thinking recommendation, same seed as the run; avg@n.
  # (Search, gate and noise stay greedy.) null = each task's tasks.yaml decoding (greedy).
  decoding:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    seed: null                        # null = the run's --seed (one experiment seed for everything)
    n: 1                              # samples per item (accuracy = avg@n)
    n_by_task: {aime24: 8, aime25: 8, amc23: 8, math500: 4, gpqa_diamond: 4}   # small sets: more samples

baseline:
  noise_repeats: 3          # sampled gate re-runs of M_0 (rsicore.gate.measure_noise_band), only when temperature > 0
  noise_temperature: 0.0    # 2026-11-20: greedy, like every evaluation -> nothing is re-run, band 0, so the
                            # retention margin is max(gate.delta, 2 SE of M_0's gate score)
  noise_top_p: 1.0
  noise_n: null             # gate items the re-runs score (deterministic subset; null = every gate item)
  noise_fixed: null         # fixed noise band instead of the re-runs (used as is, no 2 SE floor): 0.03, or
                            # {math: 0.03, default: 0.02} (keys: dataset, domain or default); unlisted datasets are measured

merge:
  gpu: true                 # accumulate W + dW on gpu1 (else CPU)

server:
  max_loras: 8
  main_args: ["--gpu-memory-utilization", "0.85", "--max-logprobs", "20"]
  theta0_args: ["--gpu-memory-utilization", "0.45", "--max-logprobs", "20"]
  mock_tasks: null

# GPU roles (lora_code/common.py gpu_layout). gpu_roles unset = EVERY GPU of --gpus is used: train = the last
# gpu_layout.train_gpus GPUs, theta0 its own GPU when E_t is on and theta0_own_gpu (else it shares train), main =
# all other GPUs as replicas (gpu_layout.main_replicas). Set gpu_roles (indices into --gpus) only to override,
# e.g. --set 'gpu_roles.train=[2,3]' (then main is a single tensor-parallel server).
gpu_roles: null
gpu_layout:
  theta0_own_gpu: false     # B300: the theta0 server shares the first train GPU (0.45 utilisation)
  share_single_gpu: false
  main_replicas: true       # 2026-11-20: main = independent vLLM replicas (data parallelism), every LoRA loaded on
                            # all of them; scoring split over them, editor thread k on replica k mod n
  main_tp: 1                # GPUs per main replica (tensor parallelism inside a replica)
  train_gpus: 1             # GPUs of the train role (HF model: SVD / acts / train_loss / merge / edit's raw LoRA)
                            # 4 GPUs, single domain: main [0, 1, 2] (3 replicas) | train [3]

# Hardware profile (--set hardware=h20, or ./launch.sh --hw h20). The defaults above assume 288 GB B300
# cards; the b300 profile plans them at 220 GB (2026-11-21). rsicore.config merges the profile over base/domain
# config and BEFORE --set (--set wins).
hardware: b300
hardware_profiles:
  b300:                     # B300 (~270 GB visible) PLANNED AT 220 GB per card (2026-11-21)
    server:                 # --rsi-gpu-memory-gib -> --gpu-memory-utilization = GB / card total (rsicore.servers;
      # the utilization given is the fallback without nvidia-smi, = GB / 270). main: 220 - 52 GB weights - ~6 GB
      # runtime - LoRA slots leaves ~150 GB KV (editor threads at 131072 tokens + scoring). theta0 shares the train
      # card (theta0_own_gpu false): 100 GB for theta0 (52 GB + ~40 GB KV), ~120 GB of the plan left for training.
      main_args: ["--rsi-gpu-memory-gib", "220", "--gpu-memory-utilization", "0.81", "--max-model-len", "131072",
                  "--max-num-seqs", "128", "--max-logprobs", "20"]   # --max-model-len = editor.context_tokens
      theta0_args: ["--rsi-gpu-memory-gib", "100", "--gpu-memory-utilization", "0.37", "--max-model-len", "20480",
                    "--max-num-seqs", "128", "--max-logprobs", "20"]
    editor: {context_tokens: 131072}   # main replicas --max-model-len 131072
  h20:                      # H20 cards (~140 GB) PLANNED AT 110 GB each (2026-11-20); Qwen3.8-27B BF16 ~52 GB
    gpu_layout: {theta0_own_gpu: true}   # theta0 vLLM (52 GB + KV) and the training model (52 GB + activations)
                                         # do not fit on one 110 GB card: own card when E_t is on (scope all)
    server:                 # --rsi-gpu-memory-gib 110 -> --gpu-memory-utilization = 110 GB / card total (rsicore.servers)
      max_loras: 8          # ~0.8 GB per rank-64 adapter slot [estimate]
      main_args: ["--rsi-gpu-memory-gib", "110", "--gpu-memory-utilization", "0.78", "--max-model-len", "131072",
                  "--max-num-seqs", "128", "--max-logprobs", "20"]   # --max-model-len = editor.context_tokens
      theta0_args: ["--rsi-gpu-memory-gib", "110", "--gpu-memory-utilization", "0.78", "--max-model-len", "20480",
                    "--max-num-seqs", "128", "--max-logprobs", "20"]
    editor: {context_tokens: 131072}   # main replicas host the editor: 2 threads x 8 GiB KV fits (was 20480)
    train:
      micro_batch: 2        # [pilot] 52 GB weights + 2 x (4k tokens: fp32 logits + grad + log-softmax ~12 GB,
                            # checkpointed activations ~1.5 GB) ~ 80 GB; raise after the smoke run's memory peak
  h20_80:                   # 80 GB H20 (the earlier plan)
    gpu_layout: {theta0_own_gpu: true}
    server:
      max_loras: 4          # vLLM reserves GPU memory for max_loras adapters of rank_cap
      main_args: ["--gpu-memory-utilization", "0.92", "--max-model-len", "49152", "--max-num-seqs", "32", "--max-logprobs", "20"]
      theta0_args: ["--gpu-memory-utilization", "0.92", "--max-model-len", "20480", "--max-num-seqs", "32", "--max-logprobs", "20"]
    editor: {context_tokens: 49152}    # ~15 GB KV per replica: 131072 does not fit (was 20480); compaction does the rest
    train:
      micro_batch: 1        # 52 GB weights + one 4k-token sequence (activations, fp32 logits) per forward

mock:
  base_quality: 0.6
  sec_per_example: 0.6

# Applied on top of everything when --mock is given: small budgets so a laptop run takes minutes.
mock_overrides:
  search: {threads: 2, steps: 2, max_evaluate: 4, top_full: 1}
  budget: {gpu_seconds: 600}
  eval: {screen_limit: 20, full_limit: 30, gate_limit: 30, kl_limit: 4}
  train_data: {mode: gold}
  nonllm: {evaluate: 2, search_scales: [0.75, 1.0]}
  e_t: {evaluate: 2, threads: 1, steps: 2, n_train: 64, n_signal: 20, test_limit: 10, gpu_seconds: 300}
  heldout: {limit: 20}
  baseline: {noise_repeats: 3}
  sandbox: {timeout_s: 120, mem_gb: 4}
  editor: {explore: {timeout_s: 60, mem_gb: 4}}   # mock_tool_rounds (1) run_python calls per proposal
