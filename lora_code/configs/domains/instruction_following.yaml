# Domain instruction_following: train pool simple_instruction_following_pool (from RLVR-IFeval; no gold text -> the raw
# LoRA's training targets (mode=edit, generation 0) are the model's own constraint-satisfying samples); the fixed
# 500-item training set is drawn from it. Override here only what differs.
train_data:
  mode: self_correct
  samples: 8                     # no gold text: more samples to find a constraint-satisfying answer
