# Per-generation draw config for Paper A (self-quantization). Copied into the run directory on the
# first draw and locked there (its sha256 is checked on every later draw).
# Config knobs: `n` per domain = items drawn per generation (signal); `screen_n`; `kl_contexts`.
# Fixed gate: `gate_n` per domain, split dynamically from the training pool before the first draw
# (data/scripts/draw.py); `gate.seed` keeps the same gate across runs with the same gate sizes.
paper: A
seed: 42                 # experiment seed (2026-11-19: single seed 42); data splits keep their own seed 20261118
screen_n: 400          # per domain: stratified subset of `signal`, used for the cheap first-stage evaluation (2026-11-20: was 200)
kl_contexts: 400       # total KL / calibration contexts per generation, split evenly over `kl_domains` (2026-11-20: was 256;
                       # every candidate's KL is scored on all of them, calibration uses the first 256)
                       # (absent = every domain; a single-domain run sets it to its own domain through
                       # <run>/draw_config.effective.yaml), disjoint from `signal`
reuse:                   # revised 2026-11-19: training data is reusable across generations
  across_generations: true          # never-used items first, then least recently used
  never_signal_after: [train, shown] # once trained on (Paper B) or shown to the editor, never signal again
gate:
  seed: 20261118         # fixed: identical gate in every run that uses the same gate_n values
domains:
  math:
    n: 2000
    gate_n: 1000
    datasets: {dapo_math: 1.0}
  code:
    n: 1000
    gate_n: 1000
    datasets: {taco_verified: 1.0}
    stratify_by: difficulty
  knowledge:
    n: 2000
    gate_n: 3000
    datasets: {triviaqa_train: 1.0}
  instruction_following:
    n: 2000
    gate_n: 1000
    datasets: {ifeval_train: 1.0}
    stratify_by: constraint_type
  tool_calling:
    n: 2000
    gate_n: 1000
    datasets: {sealtool_train: 1.0}
