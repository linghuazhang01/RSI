# Pinned source registry. Every downloaded file comes from here.
# kind: hf      -> Hugging Face dataset repo, files pinned at `revision` (commit hash)
# kind: github  -> raw files from a GitHub repo pinned at commit `revision`
# kind: pip     -> data shipped inside a pinned pip package (copied, not executed)
# kind: manual  -> gated / credentialed; NOT downloaded automatically (see data/README.md)
